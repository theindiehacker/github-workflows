name: "🧠 Claude"

# Claude Code によるレビューを PR コメントで起動する（実体は theindiehacker/github-workflows の reusable workflow）。
# このファイルをそのまま各リポジトリの .github/workflows/claude.yml にコピーする。
#   /code-review [fable] … コードレビュー
#   /security-review     … セキュリティレビュー
# uses の SHA と # vX.Y.Z は Renovate が theindiehacker/github-workflows の Release に追随させる
# （コピー先のリポジトリでも Renovate が更新 PR を出す）。導入手順は docs/SETUP.md「4.」を参照
on:
  issue_comment:
    types: [created]

# write は reusable workflow 側の job にのみ与える（ここで与えた permissions が上限になる）
permissions: {}

jobs:
  code-review:
    uses: theindiehacker/github-workflows/.github/workflows/claude-code-review.yml@v1.0.0
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    # secrets: inherit は使わない（ghalint deny_inherit_secrets）。組織シークレットをこの名前で登録する
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  security-review:
    uses: theindiehacker/github-workflows/.github/workflows/claude-security-review.yml@v1.0.0
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
