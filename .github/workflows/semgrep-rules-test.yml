name: "🧪 Semgrep のルールのテスト"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/actions/semgrep/rules/**"
      - ".github/actions/semgrep/tests/**"
      - ".github/workflows/semgrep-rules-test.yml"

permissions: {}

concurrency:
  group: github-workflows-semgrep-rules-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: "自作ルールの検出をテスト"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "semgrep scan --test"
        shell: bash
        env:
          # security.yml の Semgrep と同じ版にする
          # renovate: datasource=docker depName=semgrep/semgrep
          version: 1.184.0
          digest: sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src" --workdir /src \
            "semgrep/semgrep:${version}@${digest}" \
            semgrep scan --test \
            --metrics off \
            --disable-version-check \
            --config .github/actions/semgrep/rules \
            .github/actions/semgrep/tests
