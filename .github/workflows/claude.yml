name: "🧠 Claude"

on:
  workflow_call:
    inputs:
      effort:
        description: "Claude Code の effort (low / medium / high / xhigh / max)。空なら Claude Code の既定値"
        type: string
        required: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "claude setup-token で発行した OAuth トークン（ANTHROPIC_API_KEY とどちらか一方）"
        required: false
      ANTHROPIC_API_KEY:
        description: "Anthropic API キー（CLAUDE_CODE_OAUTH_TOKEN とどちらか一方）"
        required: false

# write は job 側でのみ与える
permissions: {}

jobs:
  claude:
    name: "@claude への応答"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # 実装結果をブランチに push するため write
      contents: write
      # claude-code-action の CI 状況確認 (github_ci MCP) に必要
      actions: read
      pull-requests: write
      issues: write
      id-token: write

    # concurrency は付けないこと。同じ Issue / PR 単位で直列化すると待機枠が 1 件しかなく、
    # 実行中に届いた 2 件目以降の依頼が黙ってキャンセルされる

    # pwn request 対策。条件を緩めないこと
    # CONTRIBUTOR も許可するのは、メンバーシップ非公開のメンバーが pull_request_review(_comment) の payload で
    # CONTRIBUTOR になるため。書き込み権限は action 側でも API で確認される
    # closed / merged PR では action が PR ブランチではなく新規ブランチを作る経路に入るため open のみ
    if: >-
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.comment.author_association) &&
        (!github.event.issue.pull_request || github.event.issue.state == 'open')
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.comment.author_association) &&
        github.event.pull_request.state == 'open'
      ) || (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        github.event.review.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.review.author_association) &&
        github.event.pull_request.state == 'open'
      ) || (
        github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        github.event.issue.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.issue.author_association)
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          # false にしないこと。tag mode の action は checkout が残す認証で PR ブランチを fetch する (.github/ghalint.yml で除外)
          persist-credentials: true

      # @claude で頼むセキュリティ監査用に、cloudflare/security-audit-skill を ~/.claude/skills に入れる (プラグインではないため plugins では入らない)。
      # write 権限のある Claude が読む第三者の指示のため、CLI の版と skill のコミットを固定し、Renovate の PR でレビューしてから上げる
      - name: "🛡️ セキュリティ監査の skill を入れる"
        id: security-audit-skill
        shell: bash
        env:
          DISABLE_TELEMETRY: "1"
          # renovate: datasource=npm depName=skills
          SKILLS_VERSION: 1.7.6
          # renovate: datasource=git-refs depName=https://github.com/cloudflare/security-audit-skill branch=main
          SKILL_REF: c1c8a8c1471069fb0e188eeaff69b8e8db6564a8
        run: |
          set -euo pipefail
          npx --yes "skills@${SKILLS_VERSION}" add "https://github.com/cloudflare/security-audit-skill/tree/${SKILL_REF}/skills/security-audit" \
            --global --agent claude-code --copy --yes
          # skill の出力先。作業ディレクトリの外のため、claude_args の --add-dir で書き込みを許す
          mkdir -p "$HOME/security-audit-skill"
          echo "home=$HOME" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c  # v1.0.254
        env:
          # バックグラウンドを有効化しておくと応答が投稿されずにワークフローが終了するため、無効化
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          # どちらか一方だけが組織シークレットに登録されている前提。空文字は action 側で未設定として扱われる
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: false
          # Claude が実行できるコマンドは、action の既定 (git add / commit / rm と push) と、下の --allowedTools にある監査の skill のバリデータ 2 本だけ。
          # node・npx・bun などを丸ごと許可しないこと。任意のコードを実行でき、プロンプトインジェクションで checkout が .git/config に残す書き込みトークンを外に送れる
          claude_args: |
            --model claude-opus-5-5
            --max-turns 200
            ${{ inputs.effort && format('--effort {0}', inputs.effort) }}
            --add-dir ${{ steps.security-audit-skill.outputs.home }}/security-audit-skill
            --allowedTools "Skill(security-audit),Bash(node ${{ steps.security-audit-skill.outputs.home }}/.claude/skills/security-audit/validate-findings.cjs:*),Bash(node ${{ steps.security-audit-skill.outputs.home }}/.claude/skills/security-audit/validate-coverage-ledger.cjs:*)"
