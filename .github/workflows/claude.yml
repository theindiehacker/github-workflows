name: "🧠 Claude"

on:
  workflow_call:
    inputs:
      effort:
        description: "Claude Code の effort (low / medium / high / xhigh / max)。空なら Claude Code の既定値"
        type: string
        required: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "claude setup-token で発行した OAuth トークン（ANTHROPIC_API_KEY とどちらか一方）"
        required: false
      ANTHROPIC_API_KEY:
        description: "Anthropic API キー（CLAUDE_CODE_OAUTH_TOKEN とどちらか一方）"
        required: false

# write は job 側でのみ与える
permissions: {}

jobs:
  claude:
    name: "@claude への応答"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # 実装結果をブランチに push するため write
      contents: write
      # claude-code-action の CI 状況確認 (github_ci MCP) に必要
      actions: read
      pull-requests: write
      issues: write
      id-token: write

    # concurrency は付けないこと。同じ Issue / PR 単位で直列化すると待機枠が 1 件しかなく、
    # 実行中に届いた 2 件目以降の依頼が黙ってキャンセルされる

    # pwn request 対策。条件を緩めないこと
    # CONTRIBUTOR も許可するのは、メンバーシップ非公開のメンバーが pull_request_review(_comment) の payload で
    # CONTRIBUTOR になるため。書き込み権限は action 側でも API で確認される
    # closed / merged PR では action が PR ブランチではなく新規ブランチを作る経路に入るため open のみ
    if: >-
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.comment.author_association) &&
        (!github.event.issue.pull_request || github.event.issue.state == 'open')
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.comment.author_association) &&
        github.event.pull_request.state == 'open'
      ) || (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        github.event.review.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.review.author_association) &&
        github.event.pull_request.state == 'open'
      ) || (
        github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        github.event.issue.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.issue.author_association)
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          # false にしないこと。tag mode の action は checkout が残す認証で PR ブランチを fetch する (.github/ghalint.yml で除外)
          persist-credentials: true

      # @claude で頼むセキュリティ監査 (cloudflare/security-audit-skill) を入れる
      - name: "🛡️ セキュリティ監査の skill を入れる"
        id: security-audit
        uses: $/.github/actions/security-audit

      - name: Run Claude Code
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c  # v1.0.254
        env:
          # バックグラウンドを有効化しておくと応答が投稿されずにワークフローが終了するため、無効化
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          # どちらか一方だけが組織シークレットに登録されている前提。空文字は action 側で未設定として扱われる
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: false
          # Claude が実行できるコマンドは、action の既定 (git add / commit / rm と push) と、--allowedTools の node・npx・bun。
          # node・npx・bun は任意のコードを実行できるが、許可する。起動できるのは書き込み権限のあるメンバーだけ
          # (job の if で絞り、CONTRIBUTOR で入った人も action が API で write / admin かを確かめる)。
          # 書き込みトークン (Claude App) が漏れても、ruleset で main へのマージ (1 名以上の approve が要る) とリリースタグの作成 (GitHub Actions だけ) はできない
          claude_args: |
            --model claude-opus-5-5
            --max-turns 300
            ${{ inputs.effort && format('--effort {0}', inputs.effort) }}
            --add-dir ${{ steps.security-audit.outputs.out_dir }}
            --allowedTools "Skill(security-audit),Bash(node:*),Bash(npx:*),Bash(bun:*)"

      # 監査が途中で切れても (時間切れを含む)、skill の出力 (REPORT.md・findings.json など) を取り出せるよう残す。
      # 監査を頼まれていなければ出力が無いため、何も残さない
      - name: "📦 セキュリティ監査の結果を残す"
        if: always() && steps.security-audit.outputs.out_dir != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: security-audit
          path: ${{ steps.security-audit.outputs.out_dir }}
          if-no-files-found: ignore
