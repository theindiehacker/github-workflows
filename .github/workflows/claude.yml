name: "🧠 Claude"

on:
  workflow_call:
    inputs:
      effort:
        description: "Claude Code の effort (low / medium / high / xhigh / max)。空なら Claude Code の既定値"
        type: string
        required: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "claude setup-token で発行した OAuth トークン（ANTHROPIC_API_KEY とどちらか一方）"
        required: false
      ANTHROPIC_API_KEY:
        description: "Anthropic API キー（CLAUDE_CODE_OAUTH_TOKEN とどちらか一方）"
        required: false

# write は job 側でのみ与える
permissions: {}

jobs:
  claude:
    name: "@claude への応答"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # 実装結果をブランチに push するため write
      contents: write
      # claude-code-action の CI 状況確認 (github_ci MCP) に必要
      actions: read
      pull-requests: write
      issues: write
      id-token: write

    env:
      # mise.toml の hooks を動かさない。postinstall の lefthook install で git フックが入ると、
      # Claude の commit が lefthook (Private の remote 設定を取りに行く) で止まるため
      MISE_NO_HOOKS: "1"

    # concurrency は付けないこと。同じ Issue / PR 単位で直列化すると待機枠が 1 件しかなく、
    # 実行中に届いた 2 件目以降の依頼が黙ってキャンセルされる

    # pwn request 対策。条件を緩めないこと
    # CONTRIBUTOR も許可するのは、メンバーシップ非公開のメンバーが pull_request_review(_comment) の payload で
    # CONTRIBUTOR になるため。書き込み権限は action 側でも API で確認される
    # closed / merged PR では action が PR ブランチではなく新規ブランチを作る経路に入るため open のみ
    if: >-
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.comment.author_association) &&
        (!github.event.issue.pull_request || github.event.issue.state == 'open')
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.comment.author_association) &&
        github.event.pull_request.state == 'open'
      ) || (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        github.event.review.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.review.author_association) &&
        github.event.pull_request.state == 'open'
      ) || (
        github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        github.event.issue.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.issue.author_association)
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          # false にしないこと。tag mode の action は checkout が残す認証で PR ブランチを fetch する (.github/ghalint.yml で除外)
          persist-credentials: true

      - name: Install tools with mise
        # mise.toml / mise.lock の版で uv・task などを入れる (ランナーには無い)。mise.toml が無ければ mise だけが入る。
        # 失敗しても Claude が自分で入れられるため、止めない
        continue-on-error: true
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785  # v5.2.8

      - name: Run Claude Code
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d  # v1.0.266
        env:
          # バックグラウンドを有効化しておくと応答が投稿されずにワークフローが終了するため、無効化
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          # どちらか一方だけが組織シークレットに登録されている前提。空文字は action 側で未設定として扱われる
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: false
          # 言語・パッケージマネージャーがリポジトリごとに違うため、Bash はすべて許可する。
          # 呼び出し元は信頼できる Private リポジトリに限ること。起動できるのは書き込み権限のあるメンバーだけ。
          # 既定ブランチへの直接 push・force push はルールセットが防ぐ (terraform/github/rulesets.tf)。
          # WebFetch・WebSearch は変更履歴や移行ガイドを読むため (Bash で curl も使えるので、許す範囲は増えない)
          claude_args: |
            --model claude-opus-5-5
            --max-turns 200
            ${{ inputs.effort && format('--effort {0}', inputs.effort) }}
            --allowedTools "Bash,WebFetch,WebSearch"
