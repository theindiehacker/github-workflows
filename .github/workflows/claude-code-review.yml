name: "🧠 Claude / Code Review"

on:
  workflow_call:
    inputs:
      effort:
        description: "既定の effort (low / medium / high / xhigh / max)。コメントでの指定が優先。空なら Claude Code の既定値"
        type: string
        required: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "claude setup-token で発行した OAuth トークン（ANTHROPIC_API_KEY とどちらか一方）"
        required: false
      ANTHROPIC_API_KEY:
        description: "Anthropic API キー（CLAUDE_CODE_OAUTH_TOKEN とどちらか一方）"
        required: false

# write は job 側でのみ与える
permissions: {}

jobs:
  code-review:
    name: "コードレビュー"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # claude-code-action の CI 状況確認 (github_ci MCP) に必要
      actions: read
      pull-requests: write
      # 進捗コメントの更新は issue comments API 経由なので残す
      issues: write
      id-token: write

    # workflow レベルに移さないこと (無関係なコメントで実行中のレビューが巻き添えキャンセルされる)
    # push (synchronize) では実行中のレビューを取り消さず、終わるのを待つ。
    # 取り消すと、承認を戻せるかの判定で飛ばしたときに、どのレビューも残らない
    concurrency:
      group: code-review-pr-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: ${{ github.event.action != 'synchronize' }}

    # pwn request 対策。ロール判定・Bot 除外を緩めないこと
    # closed / merged PR では action が PR ブランチではなく新規ブランチを作る経路に入るため open のみ
    # コメント本文は prefix 判定のみ (Claude Code の署名フッター等の後続文字列を許容するため)
    # PR の作成時 (Draft は Ready にしたとき) は、コメントを待たずにレビューする (依頼し忘れを防ぐ)。
    # push (synchronize) では、外れた Claude の承認を「修正の確認」で戻せるときだけ動く (「🔁 承認を戻せるか決める」)。
    # このリポジトリのブランチ (push できる = 書き込み権限がある) からの PR に限る。fork の PR には secrets が渡らない
    if: >-
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.issue.state == 'open' &&
        startsWith(github.event.comment.body, '/code-review') &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request' &&
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.type != 'Bot'
      )

    env:
      PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}

    steps:
      # PR の作成時 (自動) は、Claude の認証情報が渡らないリポジトリ (組織シークレットを渡さない public など) では何もせずに終える。
      # コメントで依頼されたときは、そのまま action が認証情報の不足を報告して失敗する
      - name: "🔑 認証情報の確認"
        id: credentials
        shell: bash
        env:
          HAS_CREDENTIALS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$HAS_CREDENTIALS" = "true" ] || [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Claude の認証情報が無いため、自動のコードレビューを飛ばしました"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "🧠 モデル・effort 決定"
        id: preflight
        if: steps.credentials.outputs.run == 'true'
        shell: bash
        env:
          # workflow injection 対策。run: の中で ${{ }} 展開しないこと
          COMMENT_BODY: ${{ github.event.comment.body }}
          DEFAULT_EFFORT: ${{ inputs.effort }}
        run: |
          set -euo pipefail

          model=claude-opus-5-5
          effort_arg="${DEFAULT_EFFORT:+--effort $DEFAULT_EFFORT}"

          # read は 1 行目のみ読む (2 行目以降は署名フッター等)。PR の作成時は空で、既定のまま
          read -ra words <<< "${COMMENT_BODY//$'\r'/}"
          for word in "${words[@]:1}"; do
            case "$word" in
              fable) model=claude-fable-5-1 ;;
              low|medium|high|xhigh|max) effort_arg="--effort $word" ;;
            esac
          done

          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "effort_arg=$effort_arg" >> "$GITHUB_OUTPUT"
          echo "レビューモデル: $model $effort_arg"

      - name: Checkout repository
        if: steps.credentials.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 0
          persist-credentials: true

      # synchronize 以外は full (通常のレビュー)。synchronize は、承認が外れていて、
      # 変更が Claude のコメント箇所だけなら verify (修正の確認)、それ以外は skip
      - name: "🔁 承認を戻せるか決める"
        id: recheck
        if: steps.credentials.outputs.run == 'true'
        uses: $/.github/actions/claude-recheck
        with:
          pr: ${{ env.PR_NUMBER }}

      - name: Run Claude Code Review
        id: review
        if: steps.recheck.outputs.mode == 'full'
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d  # v1.0.266
        env:
          # バックグラウンドを有効化しておくとレビューが投稿されずにワークフローが終了するため、無効化
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          # 判定レビューの送信指示。prompt に書くとスキルの引数 (ARGUMENTS) に混ざるため、
          # システムプロンプトへの追記として渡す (action が読む環境変数)
          APPEND_SYSTEM_PROMPT: |
            レビューを終えたら、必ず mcp__github__create_and_submit_pull_request_review で
            対象の PR にレビューを送信すること。
            event は、修正が必要な指摘 (バグ・不具合・仕様違反など) があれば REQUEST_CHANGES、
            指摘なしまたは nit / optional のみなら APPROVE とする。
            REQUEST_CHANGES なら、レビューの送信後に mcp__github__update_pull_request (draft: true) で Draft PR に変更すること。
            body は「🧠 Claude コードレビュー <結論> <理由を 1〜2 文>」の 1 行にすること。
            commitID には ${{ steps.recheck.outputs.head }} (レビューしたコミット) を指定すること。
        with:
          # どちらか一方だけが組織シークレットに登録されている前提。空文字は action 側で未設定として扱われる
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: 'true'
          show_full_output: false
          claude_args: |
            --model ${{ steps.preflight.outputs.model }}
            ${{ steps.preflight.outputs.effort_arg }}
            --max-turns 200
            --allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__github__create_and_submit_pull_request_review,mcp__github__update_pull_request"
          # 判定レビューは Claude 自身に送信させる (指示は APPEND_SYSTEM_PROMPT)。action の Claude App
          # トークンで動く MCP を経由するため、投稿者が claude[bot] になり他のコメントと一致する
          prompt: '/code-review --comment ${{ env.PR_NUMBER }}'

      # 通常のレビューを繰り返すと、毎回新しい nit が付いて終わらないため、新しい指摘は出させない。
      # 指摘への対応の良し悪しでは止めず、新しいバグのときだけ変更依頼にする
      - name: "Claude で修正を確認"
        id: verify
        if: steps.recheck.outputs.mode == 'verify'
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d  # v1.0.266
        env:
          # バックグラウンドを有効化しておくとレビューが投稿されずにワークフローが終了するため、無効化
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: 'true'
          show_full_output: false
          # インラインコメントのツールは渡さない (新しい指摘を出させない)
          claude_args: |
            --model ${{ steps.preflight.outputs.model }}
            --effort low
            --max-turns 30
            --add-dir ${{ steps.recheck.outputs.dir }}
            --allowedTools "Read,mcp__github__create_and_submit_pull_request_review,mcp__github__update_pull_request"
          prompt: |
            PR #${{ env.PR_NUMBER }} の、前回のレビューの後に push された修正を確認する。/code-review は使わず、通常のコードレビューもしないこと。

            - 前回の指摘 (path・行・本文): ${{ steps.recheck.outputs.dir }}/comments.json
            - 指摘を付けたコミット ${{ steps.recheck.outputs.base }} から HEAD までの差分: ${{ steps.recheck.outputs.dir }}/changes.diff
              (必要ならリポジトリのファイルも読んでよい)

            確かめるのは、差分が新しいバグ・不具合を入れていないかだけ。
            指摘を直していないこと・指摘と別の直し方をしたことは問題にしない。
            新しい指摘・nit・optional は出さず、インラインコメントも投稿しないこと。

            確認を終えたら、必ず mcp__github__create_and_submit_pull_request_review で PR にレビューを送信すること。
            commitID には ${{ steps.recheck.outputs.head }} (確認したコミット) を指定すること。
            event は、新しいバグ・不具合があれば REQUEST_CHANGES、なければ APPROVE とする。
            REQUEST_CHANGES なら、レビューの送信後に mcp__github__update_pull_request (draft: true) で Draft PR に変更すること。
            body は「🧠 Claude コードレビュー (修正の確認) <結論> <理由を 1〜2 文>」の 1 行にすること。
            REQUEST_CHANGES の理由には、問題の箇所 (path:line) を書くこと。

      # max-turns の超過などで判定が送られないと、承認が外れたまま何も出ないため、送られたかを確かめる。
      # Claude が動いたときだけ確かめる。PR で呼び出し側のワークフローを変えると、action は Claude を動かさずに
      # 成功で終わり (default branch と内容が違うため)、conclusion を出さない
      - name: "判定の送信を確かめる"
        if: steps.review.outputs.conclusion == 'success' || steps.verify.outputs.conclusion == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.recheck.outputs.head }}
        run: |
          set -euo pipefail

          # --jq はページごとに効くため、ページの件数を足す
          count=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
            --jq "[.[] | select(.user.login == \"claude[bot]\" and .commit_id == \"$HEAD_SHA\" and .state != \"COMMENTED\")] | length" \
            | awk '{ n += $1 } END { print n + 0 }')

          if [ "$count" -eq 0 ]; then
            echo "::error::Claude の判定 (承認・変更依頼) が $HEAD_SHA に送られていません。/code-review で再レビューを依頼してください"
            exit 1
          fi
