name: "🧠 [Claude] Code Review"

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "claude setup-token で発行した OAuth トークン（ANTHROPIC_API_KEY とどちらか一方）"
        required: false
      ANTHROPIC_API_KEY:
        description: "Anthropic API キー（CLAUDE_CODE_OAUTH_TOKEN とどちらか一方）"
        required: false

# write は job 側でのみ与える
permissions: {}

jobs:
  code-review:
    name: "コードレビュー"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # レビュー(approve / request changes)の送信にも必要
      pull-requests: write
      # 進捗コメントの更新は issue comments API 経由なので残す
      issues: write
      id-token: write

    # workflow レベルに移さないこと (無関係なコメントで実行中のレビューが巻き添えキャンセルされる)
    concurrency:
      group: code-review-pr-${{ github.event.issue.number }}
      cancel-in-progress: true

    # pwn request 対策。条件を緩めないこと
    # closed / merged PR では action が PR ブランチではなく新規ブランチを作る経路に入るため open のみ
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      (github.event.comment.body == '/code-review' || github.event.comment.body == '/code-review fable') &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)

    env:
      PR_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: "🧠 モデル決定"
        id: preflight
        shell: bash
        env:
          # workflow injection 対策。run: の中で ${{ }} 展開しないこと
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          case "$COMMENT_BODY" in
            '/code-review') model=claude-opus-5 ;;
            '/code-review fable') model=claude-fable-5-1 ;;
            *)
              # job の if で完全一致を確認済みのため到達しない
              echo "::error::想定外のコマンドです"
              exit 1
              ;;
          esac
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "レビューモデル: $model"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 0
          persist-credentials: true

      - name: Run Claude Code Review
        id: claude
        uses: anthropics/claude-code-action@0a8d3c9443bbff909ab973b6a17a340b913f229f  # v1.0.221
        env:
          # バックグラウンドを有効化しておくとレビューが投稿されずにワークフローが終了するため、無効化
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          # どちらか一方だけが組織シークレットに登録されている前提。空文字は action 側で未設定として扱われる
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: 'true'
          show_full_output: false
          claude_args: |
            --model ${{ steps.preflight.outputs.model }}
            --max-turns 200
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","request_changes"],"description":"修正が必要な指摘 (バグ・不具合・仕様違反など) が 1 件でもあれば request_changes。指摘なし、または nit / optional の指摘のみなら approve"},"summary":{"type":"string","description":"判定理由を日本語で 1〜2 文"}},"required":["verdict","summary"],"additionalProperties":false}'
          prompt: '/code-review --comment ${{ env.PR_NUMBER }}'

      - name: "🏁 判定を PR レビューとして送信"
        # Claude のレビューが失敗した場合も「判定できなかった」ことを PR に残す
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --json-schema で検証済みの判定 JSON。モデル生成値のため run: の中で ${{ }} 展開しないこと
          VERDICT: ${{ steps.claude.outputs.structured_output }}
          SELF_MARKER: "<!-- claude-review: code -->"
          PEER_MARKER: "<!-- claude-review: security -->"
          REVIEW_NAME: "🧠 Claude コードレビュー"
          RERUN_HINT: "修正後に `/code-review` とコメントして再レビューしてください。"
        run: |
          set -euo pipefail

          reviews_api="repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews"

          # $1: event, $2: 見出し, $3: 本文
          submit() {
            jq -n --arg event "$1" \
                  --arg body "${SELF_MARKER}"$'\n'"## ${REVIEW_NAME} — ${2}"$'\n\n'"${3}" \
                  '{event: $event, body: $body}' \
              | gh api "$reviews_api" --method POST --input - > /dev/null
          }

          # レビュー失敗時は VERDICT が空になる
          verdict="$(jq -r '.verdict // empty' <<< "$VERDICT" 2> /dev/null || true)"
          summary="$(jq -r '.summary // empty' <<< "$VERDICT" 2> /dev/null || true)"
          [ -n "$summary" ] || summary="(要約なし)"

          case "$verdict" in
            request_changes)
              submit REQUEST_CHANGES "⛔ 再レビューが必要です" "${summary}"$'\n\n'"${RERUN_HINT}"
              ;;
            approve)
              # 同じ bot が送るため、最新レビューで状態が上書きされる。
              # もう一方の Claude レビューが変更要求のままなら、承認で打ち消さない
              peer_state="$(gh api "$reviews_api" --paginate \
                | jq -rs --arg m "$PEER_MARKER" \
                    '[.[][] | select((.body // "") | contains($m)) | .state] | last // empty')"
              if [ "$peer_state" = "CHANGES_REQUESTED" ]; then
                submit COMMENT "✅ 指摘なし (承認は保留)" \
                  "${summary}"$'\n\n'"セキュリティレビューが変更要求中のため、承認は送信していません。"
              elif ! submit APPROVE "✅ マージ可能です" "$summary"; then
                # 自身が作成した PR は承認できない等で APPROVE が拒否された場合
                submit COMMENT "✅ マージ可能です" \
                  "${summary}"$'\n\n'"(承認レビューを送信できなかったため、コメントとして記録しています)"
              fi
              ;;
            *)
              submit COMMENT "⚠️ 判定できませんでした" \
                "レビューを完了できなかったため、マージ可否を判定できていません。"$'\n\n'"${RERUN_HINT}"
              echo "::error::判定 (structured_output) を取得できませんでした"
              exit 1
              ;;
          esac
