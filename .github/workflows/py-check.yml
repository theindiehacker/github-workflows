name: "🐍 py-check"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

# 同一 PR に連投された run のみ束ねて追い越しキャンセル
concurrency:
  group: py-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # ツール版は対象 repo の宣言を読まず中央で固定する（2 桁の版が float に化けないよう引用符で囲む）
  # renovate: datasource=pypi depName=uv
  UV_VERSION: "0.12.13"
  # renovate: datasource=pypi depName=ruff
  RUFF_VERSION: "0.16.7"
  # renovate: datasource=pypi depName=mypy
  MYPY_VERSION: "2.3.1"
  # renovate: datasource=pypi depName=import-linter
  IMPORT_LINTER_VERSION: "2.15"
  # renovate: datasource=pypi depName=deptry
  DEPTRY_VERSION: "0.25.1"

jobs:
  detect:
    name: "検査対象を検出"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # paths-filter の変更ファイル一覧取得に必要
    outputs:
      python: ${{ steps.filter.outputs.python }}
      # uv.lock のあるディレクトリの JSON 配列（例: [".", "backend"]）
      projects: ${{ steps.projects.outputs.projects || '[]' }}
    steps:
      - name: "検査の要否を判定"
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          # 削除も対象（削除したモジュールを import する側や、設定の削除で結果が変わる）
          filters: |
            python:
              - "**/*.py"
              - "**/*.pyi"
              - "**/ruff.toml"
              - "**/.ruff.toml"
              - "**/pyproject.toml"
              - "**/mypy.ini"
              - "**/.mypy.ini"
              - "**/setup.cfg"
              - "**/.importlinter"
              - "**/uv.lock"
              - "**/.python-version"
              - "**/requirements*.txt"
              - "**/Pipfile"
              - "**/Pipfile.lock"
              - "**/poetry.lock"
              - "**/pdm.lock"

      - name: "Checkout"
        if: steps.filter.outputs.python == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "uv.lock のあるディレクトリを列挙"
        id: projects
        if: steps.filter.outputs.python == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # -z でないと非 ASCII のパスが引用符付きでエスケープされる
          projects=$(git ls-files -z -- ':(glob)**/uv.lock' | tr '\0' '\n' | sed -E 's#/?uv\.lock$##; s#^$#.#' | jq -Rnc '[inputs]')
          echo "projects=${projects}" >> "${GITHUB_OUTPUT}"

  rule:
    name: "📜 規約を検査"
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # git 上のファイルだけを見る（対象 repo のコードは動かさない）。-z でないと非 ASCII のパスが引用符付きでエスケープされる

      - name: "uv で依存を管理しているか"
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' file; do
            # uv export で書き出した requirements.txt は、依存管理ではなく配布用の成果物として許可する
            if [[ "${file##*/}" == requirements*.txt ]] && head -n 1 "${file}" | grep -qF 'autogenerated by uv'; then continue; fi
            echo "::error file=${file}::${file##*/} ではなく pyproject.toml と uv.lock で依存を管理してください（https://docs.astral.sh/uv/guides/migration/pip-to-project/）"
            status=1
          done < <(git ls-files -z -- ':(glob)**/requirements*.txt' ':(glob)**/setup.py' ':(glob)**/Pipfile' ':(glob)**/Pipfile.lock' ':(glob)**/poetry.lock' ':(glob)**/pdm.lock')
          # workspace のメンバーは親ディレクトリ（ルート）の uv.lock を使う。lock が最新かは依存関係の導入時に uv が判定する
          while IFS= read -r -d '' pyproject; do
            dir=$(dirname "${pyproject}")
            until [ -e "${dir}/uv.lock" ] || [ "${dir}" = . ]; do dir=$(dirname "${dir}"); done
            if [ ! -e "${dir}/uv.lock" ]; then
              echo "::error file=${pyproject}::uv.lock がありません。uv lock を実行して uv.lock をコミットしてください（https://docs.astral.sh/uv/concepts/projects/layout/#the-lockfile）"
              status=1
            fi
          done < <(git grep -lzE '^\[(project|tool\.uv\.workspace)\]' -- ':(glob)**/pyproject.toml' || true)
          exit "${status}"

  ruff:
    name: "✏️ ruff"
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        id: uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: "ruff check"
        shell: bash
        run: uvx --python 3.12 "ruff@${RUFF_VERSION}" check --no-fix --output-format=github .

      - name: "ruff format"
        if: ${{ !cancelled() && steps.uv.outcome == 'success' }}
        shell: bash
        run: uvx --python 3.12 "ruff@${RUFF_VERSION}" format --check --diff .

  project:
    name: "🚧 型・依存関係を検査 (${{ matrix.project }})"
    needs: detect
    if: needs.detect.outputs.projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect.outputs.projects) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.project }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        id: uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: ${{ matrix.project }}
          # キーが完全一致すると保存し直さないため、中央で固定する版をすべて含める
          cache-suffix: py-check-${{ env.UV_VERSION }}-${{ env.MYPY_VERSION }}-${{ env.IMPORT_LINTER_VERSION }}-${{ env.DEPTRY_VERSION }}

      - name: "uv.lock が pyproject.toml と一致しているか"
        run: uv lock --check

      # 以降の step は !cancelled() で暗黙の success() を外し、前段が fail しても 3 ツールの結果を 1 run で出す

      - name: "🧰 依存関係を導入"
        # mypy / import-linter / deptry は導入済みの環境を要するため uv.lock に従って導入する（対象 repo のコードが動く唯一の step）。
        # 他の必須ワークフローはコードを実行しない解析に揃えてあり、ここがその線引きの唯一の例外
        # （型と依存関係の検査は third-party の実体を要するため。token は contents: read のみ・credentials も残さない）
        id: deps
        if: ${{ !cancelled() && steps.uv.outcome == 'success' }}
        continue-on-error: true
        run: |
          # uv workspace の全メンバーと extras まで入れる（extras 限定の依存が無いと deptry が誤検知する）。
          # 排他な extras の宣言やビルド失敗で入らなければ、extras を外して続行する
          if uv sync --frozen --all-packages --all-extras; then exit 0; fi
          echo "::warning::extras を含めた uv sync に失敗したため extras を除いて検査します（extras 限定の依存は deptry が誤検知することがあります）"
          uv sync --frozen --all-packages || { echo "::warning::uv sync に失敗したため mypy / import-linter / deptry は実行されません。uv.lock と index の設定を確認してください"; exit 1; }

      - name: "🧱 mypy - 型チェック"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          if ! uv run --no-sync --with "mypy==${MYPY_VERSION}" mypy .; then
            echo "::error::mypy: 「Source file found twice」「Duplicate module named」が出る場合は、pyproject.toml の [tool.mypy] に explicit_package_bases = true（src 等に置くパッケージは mypy_path も）を、検査から外すファイルは exclude を設定してください（https://mypy.readthedocs.io/en/stable/running_mypy.html#mapping-file-paths-to-modules）"
            exit 1
          fi

      - name: "➡️ lint-imports - モジュール依存関係を検査"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          if ! grep -qsE '^\[(tool\.)?importlinter\]' pyproject.toml setup.cfg .importlinter; then
            echo "::notice::import-linter の設定が無いため skip"
            exit 0
          fi
          # root package の親ディレクトリ（src や app 等）だけを import できるようにする。
          # 直下を丸ごと足すと、標準ライブラリと同名のモジュール（app/types.py 等）が優先されて壊れる
          roots=$(uv run --no-project --python '>=3.11' python - <<'EOF'
          import configparser
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          with open("pyproject.toml", "rb") as f:
              options = tomllib.load(f).get("tool", {}).get("importlinter", {})
          packages = [options.get("root_package", ""), *options.get("root_packages", [])]
          parser = configparser.ConfigParser(interpolation=None)
          parser.read(["setup.cfg", ".importlinter"])
          if parser.has_section("importlinter"):
              options = parser["importlinter"]
              packages += [options.get("root_package", ""), *options.get("root_packages", "").split()]
          pathspecs = [f":(glob)**/{package}/__init__.py" for package in packages if package]
          files = subprocess.run(["git", "ls-files", "-z", "--", *pathspecs], capture_output=True, text=True, check=True).stdout if pathspecs else ""
          roots = {Path(init).parent.parent for init in files.split("\0") if init} - {Path(".")}
          print(os.pathsep.join(str(Path.cwd() / root) for root in sorted(roots)))
          EOF
          )
          if [ -n "${roots}" ]; then export PYTHONPATH="${roots}${PYTHONPATH:+:${PYTHONPATH}}"; fi
          uv run --no-sync --with "import-linter==${IMPORT_LINTER_VERSION}" lint-imports --no-cache --no-logo

      - name: "🗑️ deptry - 不要なパッケージを検知"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          # uv workspace は、依存を宣言する単位であるメンバーごとに検査する（ルートはメンバーを内包するため対象外）
          mapfile -t members < <(uv workspace list --paths | grep -vxF "${PWD}")
          if [ "${#members[@]}" -eq 0 ]; then members=(.); fi
          status=0
          for member in "${members[@]}"; do
            echo "deptry ${member}"
            (
              cd "${member}" || exit 1
              # __init__.py を持つ最上位のパッケージを自前として渡す（src や app の配下にあると DEP001 / DEP003 になる）。
              # CLI の指定は [tool.deptry] の known_first_party を上書きするため、その値も合わせて渡す
              args=()
              while IFS= read -r package; do
                if [ -n "${package}" ]; then args+=(--known-first-party "${package}"); fi
              done < <(
                uv run --no-project --python '>=3.11' python -c 'import tomllib; print(*tomllib.load(open("pyproject.toml", "rb")).get("tool", {}).get("deptry", {}).get("known_first_party", []), sep="\n")'
                git ls-files -z -- ':(glob)*/**/__init__.py' | while IFS= read -r -d '' init; do
                  package=$(dirname "${init}")
                  if [ ! -e "$(dirname "${package}")/__init__.py" ]; then echo "${package##*/}"; fi
                done
              )
              uv run --no-sync --with "deptry==${DEPTRY_VERSION}" deptry . "${args[@]}"
            ) || status=1
          done
          if [ "${status}" -ne 0 ]; then
            echo "::error::deptry: 自プロジェクトのパッケージ（src/ や app/ 配下など）が DEP001 / DEP003 になる場合は pyproject.toml の [tool.deptry] known_first_party に（https://deptry.com/usage/#known-first-party）、別の uv.lock を持つ入れ子のプロジェクトなど検査から外すディレクトリは extend_exclude に（https://deptry.com/usage/#extend-exclude）追加してください。その他の違反の対処は https://deptry.com/rules-violations/ を参照してください"
          fi
          exit "${status}"
