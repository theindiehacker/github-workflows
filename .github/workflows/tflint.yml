name: "🏗️ tflint"

# Terraform の定義ファイルを tflint で lint する。
#
# ⚠️ 必須ワークフローは on: のフィルタ（paths / branches / types 等）が無視され全 PR で起動されるため、
#    「Terraform 関連ファイルが変更されたか」の判定は本ワークフロー内で行う。
#    対象ファイルの変更がない PR では lint を skip し、run 全体は success になる
#    （ルールセットが All repositories 適用のため、Terraform 未使用の repo でも合格できる必要がある）。
#
# 設定ファイル（.tflint.hcl）は「実行ディレクトリ自身のもの > リポジトリ直下のもの」の優先で適用する
# （tflint は --chdir 先でリポジトリ直下の設定を自動では読まないため、直下の設定は --config で明示する）。
# どちらも無ければ組み込み terraform ruleset の recommended プリセットで lint される。
# plugin（provider ruleset 等）は .tflint.hcl で宣言すれば実行前の tflint --init で導入される。
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:  # Free プラン運用の caller から呼ばれる（docs/SETUP/FREE.md）

permissions:
  contents: read
  pull-requests: read  # paths-filter の変更ファイル一覧取得に必要

# 同一 PR に連投された run のみ束ねて追い越しキャンセル
concurrency:
  group: tflint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Terraform を lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "lint 対象を判定"
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        with:
          list-files: json
          # 削除ファイルは lint できないため対象外（rename は added + deleted に分解され新パス側が対象になる）
          filters: |
            config:
              - added|modified|copied: ".tflint.hcl"
              - added|modified|copied: "**/.tflint.hcl"
            terraform:
              - added|modified|copied: "**/*.tf"
              - added|modified|copied: "**/*.tf.json"
              - added|modified|copied: "**/*.tfvars"
              - added|modified|copied: "**/*.tfvars.json"

      - name: "Checkout"
        if: steps.filter.outputs.config == 'true' || steps.filter.outputs.terraform == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: "Install tflint"
        if: steps.filter.outputs.config == 'true' || steps.filter.outputs.terraform == 'true'
        shell: bash
        env:
          VERSION: 0.64.0
          # tflint_linux_amd64.zip の SHA256（公式 checksums.txt から確定）
          SHA256: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
        run: |
          set -euo pipefail
          ARCHIVE="tflint_linux_amd64.zip"
          curl -sSfL -o "$ARCHIVE" "https://github.com/terraform-linters/tflint/releases/download/v${VERSION}/${ARCHIVE}"

          # SHA-256 検証（改ざん・破損を検知）
          echo "${SHA256}  ${ARCHIVE}" | sha256sum -c -

          sudo unzip -o "$ARCHIVE" tflint -d /usr/local/bin
          sudo chmod +x /usr/local/bin/tflint
          rm -f "$ARCHIVE"
          tflint --version

      - name: "tflint"
        if: steps.filter.outputs.config == 'true' || steps.filter.outputs.terraform == 'true'
        shell: bash
        env:
          # plugin を使う repo の tflint --init が GitHub Releases から取得する際の rate limit 対策
          GITHUB_TOKEN: ${{ github.token }}
          # 設定ファイルは全ディレクトリの検出結果に影響するため、変更時は全ディレクトリを lint
          SCAN_ALL: ${{ steps.filter.outputs.config }}
          TARGETS: ${{ steps.filter.outputs.terraform_files }}
        run: |
          set -euo pipefail

          # lint はディレクトリ（モジュール）単位のため、変更ファイルをディレクトリに集約する。
          # .terraform はキャッシュ・vendored モジュール置き場のため lint 対象外
          if [ "${SCAN_ALL}" = "true" ]; then
            dirs=$(
              find . \( -path ./.git -o -name .terraform \) -prune -o \
                -type f \( -name '*.tf' -o -name '*.tf.json' \) -print \
              | sed 's|^\./||' \
              | while IFS= read -r f; do dirname "${f}"; done | sort -u
            )
          else
            dirs=$(
              jq -r '.[]' <<< "${TARGETS}" | { grep -Ev '(^|/)\.terraform/' || true; } \
              | while IFS= read -r f; do dirname "${f}"; done | sort -u
            )
          fi

          status=0
          while IFS= read -r dir; do
            if [ -z "${dir}" ]; then continue; fi
            echo "::group::${dir}"

            args=()
            if [ "${dir}" != "." ] && [ ! -f "${dir}/.tflint.hcl" ] && [ -f .tflint.hcl ]; then
              args=(--config="${PWD}/.tflint.hcl")
            fi

            tflint --chdir="${dir}" "${args[@]}" --init
            result="${RUNNER_TEMP}/tflint.json"
            code=0
            tflint --chdir="${dir}" "${args[@]}" --format=json > "${result}" || code=$?
            if [ "${code}" -ne 0 ]; then status=1; fi

            # 検出箇所を PR に annotation 表示する（filename は --chdir 実行でもリポジトリルート基準で出力される）
            jq -r '
              ((.issues // [])[]
                | "::error file=\(.range.filename),line=\(.range.start.line)::tflint (\(.rule.name)): \(.message)"),
              ((.errors // [])[]
                | if .range then "::error file=\(.range.filename),line=\(.range.start.line)::tflint: \(.message)"
                  else "::error::tflint: \(.message)" end)
            ' "${result}"
            echo "::endgroup::"
          done <<< "${dirs}"
          exit "${status}"
