name: "🧠 Claude / Security Audit"

on:
  workflow_call:
    inputs:
      effort:
        description: "Claude Code の effort (low / medium / high / xhigh / max)。空なら Claude Code の既定値"
        type: string
        required: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "claude setup-token で発行した OAuth トークン（ANTHROPIC_API_KEY とどちらか一方）"
        required: false
      ANTHROPIC_API_KEY:
        description: "Anthropic API キー（CLAUDE_CODE_OAUTH_TOKEN とどちらか一方）"
        required: false

# write は job 側でのみ与える
permissions: {}

env:
  AUDIT_LABEL: security-audit

jobs:
  # Claude には書き込み権限を渡さないこと。起票は file-issues job で行う
  audit:
    name: "セキュリティ監査"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read

    concurrency:
      group: security-audit
      cancel-in-progress: false

    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    outputs:
      findings: ${{ steps.findings.outputs.findings }}
      count: ${{ steps.findings.outputs.count }}

    steps:
      # 公開リポジトリでは、脆弱性が公開 Issue になるため動かさない
      - name: "🔑 前提の確認"
        id: precondition
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_CREDENTIALS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          set -euo pipefail
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.visibility')"
          if [ "$HAS_CREDENTIALS" != "true" ]; then
            echo "::notice::Claude の認証情報が無いため、セキュリティ監査を飛ばしました"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$visibility" != "private" ] && [ "$visibility" != "internal" ]; then
            echo "::notice::${visibility} のリポジトリでは指摘が公開されるため、セキュリティ監査を飛ばしました"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "🔎 起票済みの Issue・effort を取得"
        id: preflight
        if: steps.precondition.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_EFFORT: ${{ inputs.effort }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/security-audit"
          gh issue list --repo "$GITHUB_REPOSITORY" --label "$AUDIT_LABEL" --state all --limit 1000 \
            --json number,title,state,stateReason,body > "$RUNNER_TEMP/security-audit/issues.json"
          echo "起票済みの Issue: $(jq length "$RUNNER_TEMP/security-audit/issues.json") 件"
          echo "effort_arg=${DEFAULT_EFFORT:+--effort $DEFAULT_EFFORT}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.precondition.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Security Audit
        id: claude
        if: steps.precondition.outputs.run == 'true'
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c  # v1.0.254
        env:
          # バックグラウンドを有効化しておくとサブエージェントの結果を待たずに終了するため、無効化
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          # どちらか一方だけが組織シークレットに登録されている前提。空文字は action 側で未設定として扱われる
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude App のトークン (書き込み権限あり) ではなく、この job の read のトークンを使わせる
          github_token: ${{ github.token }}
          # schedule の actor は、最後にワークフローを変えた bot (Renovate など) になりうる。
          # 起動できるのは schedule / workflow_dispatch だけで、プロンプトも固定のため、bot を許可しても入口は増えない
          allowed_bots: '*'
          show_full_output: false
          claude_args: |
            --model claude-opus-5-5
            ${{ steps.preflight.outputs.effort_arg }}
            --max-turns 300
            --add-dir ${{ runner.temp }}/security-audit
            --json-schema '{"type":"object","properties":{"findings":{"type":"array","maxItems":10,"items":{"type":"object","properties":{"title":{"type":"string"},"severity":{"type":"string","enum":["HIGH","MEDIUM"]},"body":{"type":"string"}},"required":["title","severity","body"],"additionalProperties":false}}},"required":["findings"],"additionalProperties":false}'
          prompt: |
            このリポジトリ全体のセキュリティ監査をしてください。PR の差分ではなく、すでにコードにある問題を探します。

            ## 見るもの
            - インジェクション (SQL・コマンド・テンプレート・パス・XXE など)、認証・認可の欠陥、暗号とシークレットの扱い、デシリアライズや eval によるコード実行、XSS、機密データ・個人情報の露出
            - GitHub Actions のワークフローと action の定義: 信頼できない入力 (Issue・PR・コメントの本文、ブランチ名など) が、`run:` の中での式 (`github.event.*` など) の直接の展開・環境変数・スクリプトの引数を通じて実行されるもの、`pull_request_target` や `workflow_run` などの危険なトリガー、攻撃が成立する過剰な permissions やシークレットの渡し方
            - シェルスクリプトのコマンドインジェクション
            - AI エージェント (claude-code-action など) へのプロンプトインジェクション: 信頼できない入力を読んだエージェントが、書き込み権限やシークレットを使えるもの
            - エージェントへの指示になる Markdown (SKILL.md・CLAUDE.md・エージェントの定義など) で、危険な操作を指示・許可しているもの
            - IaC (Terraform など) の公開設定・過剰な権限
            - コードや設定に書かれたシークレット

            ## 報告しないもの
            - 依存パッケージの既知の脆弱性 (Trivy と Renovate が扱う)
            - DoS・レート制限・リソースの枯渇
            - 具体的な攻撃経路の無い、多層防御やハードニングの不足
            - テストでだけ使うファイル
            - 理論上だけの問題

            ## 進め方
            1. リポジトリの構成を調べ、領域 (アプリケーション・ワークフロー・スクリプト・IaC・エージェントの設定など) ごとにサブエージェントを並列で起動して、候補を洗い出す
            2. 候補ごとに別のサブエージェントを並列で起動し、コードを読んで誤検知かどうかを確かめさせ、確信度を 1〜10 で付けさせる。誰が・どの入力から・何をできるかを具体的に示せない候補は誤検知とする
            3. 確信度が 8 未満の候補と、重大度が下記の HIGH・MEDIUM に当たらない候補を捨てる

            重大度は次の 2 つだけを使う。
            - HIGH: 直接悪用でき、コードの実行・データの漏洩・認証の回避・権限の昇格につながる
            - MEDIUM: 特定の条件が要るが、影響が大きい

            ## 起票済みの Issue との重複
            `${{ runner.temp }}/security-audit/issues.json` に、これまでの監査で起票した Issue がある。次の Issue と同じ問題は報告しない。
            - open の Issue
            - stateReason が NOT_PLANNED か DUPLICATE で閉じた Issue (誤検知・許容したリスクなど)

            stateReason が COMPLETED で閉じた Issue と同じ問題は、今もコードに残っている (再発した) ときだけ報告し、本文で元の Issue (#番号) に触れる。

            ## 出力
            重大度の高い順に最大 10 件を、構造化出力の findings に入れる。見つからなければ空の配列にする。日本語で書く。
            - title: 「<分類>: <概要> (<ファイルのパス>)」の形。例: 「コマンドインジェクション: Issue のタイトルを run で展開している (.github/workflows/triage.yml)」
            - severity: HIGH か MEDIUM
            - body: Markdown で、「場所」(`path:line`)・「内容」・「攻撃シナリオ」(誰が・どの入力から・何をできるか)・「修正案」の見出しを付ける

      - name: "📋 指摘を取り出す"
        id: findings
        if: steps.precondition.outputs.run == 'true'
        shell: bash
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
        run: |
          set -euo pipefail
          findings="$(jq -ce '.findings' <<< "$STRUCTURED_OUTPUT")"
          count="$(jq length <<< "$findings")"
          echo "監査の指摘: ${count} 件"
          {
            echo "findings=$findings"
            echo "count=$count"
          } >> "$GITHUB_OUTPUT"

  file-issues:
    name: "Issue に起票"
    needs: audit
    if: fromJSON(needs.audit.outputs.count || '0') > 0
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: "📝 指摘を Issue に起票"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # workflow injection 対策。run: の中で ${{ }} 展開しないこと
          FINDINGS: ${{ needs.audit.outputs.findings }}
        run: |
          set -euo pipefail
          gh label create "$AUDIT_LABEL" --repo "$GITHUB_REPOSITORY" --force \
            --color B60205 --description "定期のセキュリティ監査で見つかった問題"

          footer=$'---\n定期のセキュリティ監査が起票しました。誤検知・許容するリスクは「Close as not planned」で閉じると、次回から起票しません。'
          # jq の失敗を set -e で失敗にするため、プロセス置換ではなくファイル経由にする
          jq -c '.[]' <<< "$FINDINGS" > "$RUNNER_TEMP/findings.jsonl"
          body_file="$RUNNER_TEMP/issue-body.md"
          while IFS= read -r -u 3 finding; do
            title="$(jq -r '"[\(.severity)] \(.title)"' <<< "$finding")"
            {
              jq -r '.body' <<< "$finding"
              printf '\n%s\n' "$footer"
            } > "$body_file"
            gh issue create --repo "$GITHUB_REPOSITORY" --label "$AUDIT_LABEL" --title "$title" --body-file "$body_file"
          done 3< "$RUNNER_TEMP/findings.jsonl"
