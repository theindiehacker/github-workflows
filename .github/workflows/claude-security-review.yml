name: "🧠 [Claude] Security Review"

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "claude setup-token で発行した OAuth トークン（ANTHROPIC_API_KEY とどちらか一方）"
        required: false
      ANTHROPIC_API_KEY:
        description: "Anthropic API キー（CLAUDE_CODE_OAUTH_TOKEN とどちらか一方）"
        required: false

# write は job 側でのみ与える
permissions: {}

jobs:
  security-review:
    name: "セキュリティレビュー"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # レビュー(approve / request changes)の送信にも必要
      pull-requests: write
      issues: write
      id-token: write

    # workflow レベルに移さないこと (無関係なコメントで実行中のレビューが巻き添えキャンセルされる)
    concurrency:
      group: security-review-pr-${{ github.event.issue.number }}
      cancel-in-progress: true

    # pwn request 対策。条件を緩めないこと
    # closed / merged PR では action が PR ブランチではなく新規ブランチを作る経路に入るため open のみ
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.comment.body == '/security-review' &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)

    env:
      PR_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: "🔎 PR の base ブランチを取得"
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # --jq は欠損フィールドをリテラル "null" にするため、空と併せて弾く
          base_ref="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.ref')"
          if [ -z "$base_ref" ] || [ "$base_ref" = "null" ]; then
            echo "::error::PR の base ブランチを取得できませんでした"
            exit 1
          fi
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 0
          # false にしないこと。tag mode の action は checkout が残す認証で PR ブランチを fetch する (.github/ghalint.yml で除外)
          persist-credentials: true

      - name: "🔖 origin/HEAD を PR の base に向ける"
        shell: bash
        env:
          BASE_REF: ${{ steps.preflight.outputs.base_ref }}
        run: |
          set -euo pipefail
          # security-review スキルは内部で `git diff origin/HEAD...` を使うが、checkout は origin/HEAD を作らない。
          # `git remote set-head origin --auto` だと既定ブランチに向いてしまうため、PR の実 base へ向ける
          # symbolic-ref は参照先の存在を確認しないため、無い場合はスキル実行前にここで失敗させる
          if ! git rev-parse --verify --quiet "refs/remotes/origin/${BASE_REF}" > /dev/null; then
            echo "::error::base ブランチ origin/${BASE_REF} が見つかりません"
            exit 1
          fi
          git symbolic-ref refs/remotes/origin/HEAD "refs/remotes/origin/${BASE_REF}"

      - name: Run Claude Security Review
        id: claude
        uses: anthropics/claude-code-action@0a8d3c9443bbff909ab973b6a17a340b913f229f  # v1.0.221
        env:
          # バックグラウンドを有効化しておくとレビューが投稿されずにワークフローが終了するため、無効化
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          # どちらか一方だけが組織シークレットに登録されている前提。空文字は action 側で未設定として扱われる
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: 'true'
          show_full_output: false
          claude_args: |
            --model claude-opus-5
            --max-turns 200
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","request_changes"],"description":"悪用可能な脆弱性を 1 件でも報告した場合は request_changes。報告すべき指摘がなければ approve"},"summary":{"type":"string","description":"判定理由を日本語で 1〜2 文"}},"required":["verdict","summary"],"additionalProperties":false}'
          # 指摘を該当行にも残すため、投稿先を引数で指示する (引数はスキル本文の末尾に ARGUMENTS として付く)
          prompt: '/security-review 報告する各指摘を mcp__github_inline_comment__create_inline_comment で該当行へのインラインコメントとして投稿すること'

      - name: "🏁 判定を PR レビューとして送信"
        # Claude のレビューが失敗した場合も「判定できなかった」ことを PR に残す
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # checkout に失敗した場合でも gh がリポジトリを特定できるようにする
          GH_REPO: ${{ github.repository }}
          # --json-schema で検証済みの判定。レビューが失敗した場合は空になる
          VERDICT: ${{ steps.claude.outputs.structured_output }}
          TITLE: "🧠 Claude セキュリティレビュー"
          PEER_TITLE: "🧠 Claude コードレビュー"
          HINT: "修正後に `/security-review` とコメントして再レビューしてください。"
        run: |
          set -euo pipefail

          verdict="$(jq -r '.verdict // empty' <<< "$VERDICT" 2> /dev/null || true)"
          summary="$(jq -r '.summary // empty' <<< "$VERDICT" 2> /dev/null || true)"

          case "$verdict" in
            request_changes)
              gh pr review "$PR_NUMBER" --request-changes --body "$TITLE ⛔ 再レビューが必要です。$summary $HINT"
              ;;
            approve)
              # 2 つのレビューは同じ bot が送るため、後から送ったレビューで PR の状態が上書きされる。
              # もう一方が変更要求中なら、承認で打ち消さずコメントに留める
              peer="$(gh pr view "$PR_NUMBER" --json reviews \
                | jq -r --arg t "$PEER_TITLE" '[.reviews[] | select(.body | startswith($t)) | .state] | last // ""')"
              if [ "$peer" = CHANGES_REQUESTED ]; then
                gh pr review "$PR_NUMBER" --comment --body "$TITLE ⏸️ 承認を保留しました。$summary (コードレビューが変更要求中のため)"
              else
                gh pr review "$PR_NUMBER" --approve --body "$TITLE ✅ マージ可能です。$summary"
              fi
              ;;
            *)
              gh pr review "$PR_NUMBER" --comment --body "$TITLE ⚠️ レビューを完了できなかったため、マージ可否を判定できませんでした。$HINT"
              echo "::error::判定 (structured_output) を取得できませんでした"
              exit 1
              ;;
          esac
