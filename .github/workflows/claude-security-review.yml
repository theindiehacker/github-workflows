name: "🧠 [Claude] Security Review"

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "claude setup-token で発行した OAuth トークン（ANTHROPIC_API_KEY とどちらか一方）"
        required: false
      ANTHROPIC_API_KEY:
        description: "Anthropic API キー（CLAUDE_CODE_OAUTH_TOKEN とどちらか一方）"
        required: false

# write は job 側でのみ与える
permissions: {}

jobs:
  security-review:
    name: "セキュリティレビュー"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # レビュー(approve / request changes)の送信にも必要
      pull-requests: write
      issues: write
      id-token: write

    # workflow レベルに移さないこと (無関係なコメントで実行中のレビューが巻き添えキャンセルされる)
    concurrency:
      group: security-review-pr-${{ github.event.issue.number }}
      cancel-in-progress: true

    # pwn request 対策。条件を緩めないこと
    # closed / merged PR では action が PR ブランチではなく新規ブランチを作る経路に入るため open のみ
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.comment.body == '/security-review' &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)

    env:
      PR_NUMBER: ${{ github.event.issue.number }}
      # Claude が判定を書き出すファイル。後続ステップが読んで PR レビューを送信する
      VERDICT_FILE: ${{ github.workspace }}/claude-review-verdict.json

    steps:
      - name: "🔎 PR の base ブランチを取得"
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # --jq は欠損フィールドをリテラル "null" にするため、空と併せて弾く
          base_ref="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.ref')"
          if [ -z "$base_ref" ] || [ "$base_ref" = "null" ]; then
            echo "::error::PR の base ブランチを取得できませんでした"
            exit 1
          fi
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 0
          # false にしないこと。tag mode の action は checkout が残す認証で PR ブランチを fetch する (.github/ghalint.yml で除外)
          persist-credentials: true

      - name: "🔖 origin/HEAD を PR の base に向ける"
        shell: bash
        env:
          BASE_REF: ${{ steps.preflight.outputs.base_ref }}
        run: |
          set -euo pipefail
          # security-review スキルは内部で `git diff origin/HEAD...` を使うが、checkout は origin/HEAD を作らない。
          # `git remote set-head origin --auto` だと既定ブランチに向いてしまうため、PR の実 base へ向ける
          # symbolic-ref は参照先の存在を確認しないため、無い場合はスキル実行前にここで失敗させる
          if ! git rev-parse --verify --quiet "refs/remotes/origin/${BASE_REF}" > /dev/null; then
            echo "::error::base ブランチ origin/${BASE_REF} が見つかりません"
            exit 1
          fi
          git symbolic-ref refs/remotes/origin/HEAD "refs/remotes/origin/${BASE_REF}"

      - name: Run Claude Security Review
        uses: anthropics/claude-code-action@0a8d3c9443bbff909ab973b6a17a340b913f229f  # v1.0.221
        env:
          # バックグラウンドを有効化しておくとレビューが投稿されずにワークフローが終了するため、無効化
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          # どちらか一方だけが組織シークレットに登録されている前提。空文字は action 側で未設定として扱われる
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: 'true'
          show_full_output: false
          claude_args: |
            --model claude-opus-5
            --max-turns 200
            --allowedTools "Write,mcp__github_inline_comment__create_inline_comment"
          # 指摘を該当行にも残すため、投稿先を引数で指示する (引数はスキル本文の末尾に ARGUMENTS として付く)
          # 判定は Claude に PR レビューを送信させず、ファイル経由で受け取って次ステップが送信する
          prompt: |
            /security-review 報告する各指摘を mcp__github_inline_comment__create_inline_comment で該当行へのインラインコメントとして投稿すること

            【レビュー後に必ず行うこと】Write ツールで ${{ env.VERDICT_FILE }} を次の JSON 形式で作成する。
            {"verdict": "approve" または "request_changes", "summary": "判定理由 (日本語で 1〜2 文)"}
            判定基準: 悪用可能な脆弱性を 1 件でも報告した場合は request_changes。報告すべき指摘がなければ approve。

      - name: "🏁 判定を PR レビューとして送信"
        # Claude のレビューが失敗した場合も「判定できなかった」ことを PR に残す
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELF_MARKER: "<!-- claude-review: security -->"
          PEER_MARKER: "<!-- claude-review: code -->"
          REVIEW_NAME: "🧠 Claude セキュリティレビュー"
          RERUN_HINT: "修正後に `/security-review` とコメントして再レビューしてください。"
        run: |
          set -euo pipefail

          reviews_api="repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews"

          # $1: event, $2: 見出し, $3: 本文
          submit() {
            jq -n --arg event "$1" \
                  --arg body "${SELF_MARKER}"$'\n'"## ${REVIEW_NAME} — ${2}"$'\n\n'"${3}" \
                  '{event: $event, body: $body}' \
              | gh api "$reviews_api" --method POST --input - > /dev/null
          }

          verdict=""
          summary=""
          if [ -f "$VERDICT_FILE" ]; then
            verdict="$(jq -r '.verdict // empty' "$VERDICT_FILE" 2> /dev/null || true)"
            summary="$(jq -r '.summary // empty' "$VERDICT_FILE" 2> /dev/null || true)"
          fi
          [ -n "$summary" ] || summary="(要約なし)"

          case "$verdict" in
            request_changes)
              submit REQUEST_CHANGES "⛔ 再レビューが必要です" "${summary}"$'\n\n'"${RERUN_HINT}"
              ;;
            approve)
              # 同じ bot が送るため、最新レビューで状態が上書きされる。
              # もう一方の Claude レビューが変更要求のままなら、承認で打ち消さない
              peer_state="$(gh api "$reviews_api" --paginate \
                | jq -rs --arg m "$PEER_MARKER" \
                    '[.[][] | select((.body // "") | contains($m)) | .state] | last // empty')"
              if [ "$peer_state" = "CHANGES_REQUESTED" ]; then
                submit COMMENT "✅ 指摘なし (承認は保留)" \
                  "${summary}"$'\n\n'"コードレビューが変更要求中のため、承認は送信していません。"
              elif ! submit APPROVE "✅ マージ可能です" "$summary"; then
                # 自身が作成した PR は承認できない等で APPROVE が拒否された場合
                submit COMMENT "✅ マージ可能です" \
                  "${summary}"$'\n\n'"(承認レビューを送信できなかったため、コメントとして記録しています)"
              fi
              ;;
            *)
              submit COMMENT "⚠️ 判定できませんでした" \
                "レビューを完了できなかったため、マージ可否を判定できていません。"$'\n\n'"${RERUN_HINT}"
              echo "::error::判定ファイルを読み取れませんでした (${VERDICT_FILE})"
              exit 1
              ;;
          esac
