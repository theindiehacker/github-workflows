rules:
  - id: python-cors-credentials-any-origin
    languages: [python]
    severity: ERROR
    message: どのサイトにも、Cookie 付きのリクエストと応答の読み取りを許しています (CORS)。Starlette はこの設定だと、届いた Origin をそのまま許可します。allow_origins に自サイトのオリジンだけを並べてください。
    metadata:
      category: security
      technology: [fastapi, starlette]
      cwe: "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $APP.add_middleware(CORSMiddleware, ..., allow_credentials=True, ...)
          - pattern: Middleware(CORSMiddleware, ..., allow_credentials=True, ...)
      - pattern-either:
          - pattern: $APP.add_middleware(CORSMiddleware, ..., allow_origins=[..., "*", ...], ...)
          - pattern: Middleware(CORSMiddleware, ..., allow_origins=[..., "*", ...], ...)
          # 定数などの変数に入れた一覧
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $V = [..., "*", ...]
                      ...
                  - pattern-inside: |
                      $V = (..., "*", ...)
                      ...
              - pattern-either:
                  - pattern: $APP.add_middleware(CORSMiddleware, ..., allow_origins=$V, ...)
                  - pattern: Middleware(CORSMiddleware, ..., allow_origins=$V, ...)
          - patterns:
              - pattern-either:
                  - pattern: $APP.add_middleware(CORSMiddleware, ..., allow_origin_regex=$R, ...)
                  - pattern: Middleware(CORSMiddleware, ..., allow_origin_regex=$R, ...)
              # .*・^https://.*$ など、どのオリジンにも一致する正規表現
              - metavariable-regex:
                  metavariable: $R
                  regex: ^[rRuU]?["'](\^)?(https?\??://|\(https?\)://)?\.[*+]\$?["']$

  - id: python-zip-slip
    mode: taint
    languages: [python]
    severity: ERROR
    message: アーカイブの中の名前で、ファイルを書いています (Zip Slip)。../ を含む名前だと置き場の外に書かれます。zipfile は extractall を、tarfile は extractall(filter="data") を使うか、resolve() した先が置き場の中かを is_relative_to で確かめてください。
    metadata:
      category: security
      technology: [python]
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      confidence: HIGH
    pattern-sources:
      - pattern: $A.namelist()
      - pattern: $A.infolist()
      - pattern: $A.getnames()
      - pattern: $A.getmembers()
    pattern-sanitizers:
      - pattern: os.path.basename(...)
      - pattern: Path(...).name
      - pattern: PurePath(...).name
      # 置き場の中かを確かめた後のパスは、置き場の外を指さない。
      # is_relative_to・relative_to は文字列で比べるだけで ../ を畳まないので、resolve() したパスで確かめたときだけにする
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $T.resolve(...).is_relative_to(...)
              - pattern: $T.resolve(...).relative_to(...)
          - focus-metavariable: $T
      - by-side-effect: true
        patterns:
          - pattern-inside: |
              $T = $X.resolve(...)
              ...
          - pattern-either:
              - pattern: $T.is_relative_to(...)
              - pattern: $T.relative_to(...)
          - focus-metavariable: $T
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: open($P, ...)
              - pattern: $P.open(...)
              - pattern: $P.write_bytes(...)
              - pattern: $P.write_text(...)
              - pattern: $P.mkdir(...)
              - pattern: $P.touch(...)
              - pattern: os.makedirs($P, ...)
              - pattern: os.mkdir($P, ...)
              - pattern: shutil.copy($SRC, $P, ...)
              - pattern: shutil.copyfile($SRC, $P, ...)
              - pattern: shutil.move($SRC, $P, ...)
          - focus-metavariable: $P

  - id: python-mass-assignment
    languages: [python]
    severity: ERROR
    message: 受け取った項目を、すべてそのまま属性に入れています (一括代入)。role などの項目を混ぜられると、権限を上げられます。入れてよい項目を Pydantic のモデルか許可リストで絞ってください。
    metadata:
      category: security
      technology: [python]
      cwe: "CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  for $K, $V in $B.items():
                      ...
              - pattern: setattr($O, $K, $V)
          - patterns:
              - pattern-inside: |
                  for $K in $B:
                      ...
              - pattern: setattr($O, $K, $B[$K])
      # Pydantic のモデルは、モデルにある項目しか持たない
      - pattern-not-inside: |
          for $K, $V in $M.model_dump(...).items():
              ...
      - pattern-not-inside: |
          for $K, $V in $M.dict(...).items():
              ...
      # 許可リスト (定数か、文字列を並べたリテラル) で絞っていれば除く。user.__table__.columns や受け取った dict では絞れていない
      - pattern-either:
          - patterns:
              - pattern: setattr(...)
              - pattern-not-inside: |
                  if $K in $X:
                      ...
              - pattern-not-inside: |
                  if $K not in $X:
                      continue
                  ...
          - patterns:
              - pattern: setattr(...)
              - pattern-either:
                  - pattern-inside: |
                      if $K in $X:
                          ...
                  - pattern-inside: |
                      if $K not in $X:
                          continue
                      ...
              - metavariable-regex:
                  metavariable: $X
                  regex: ^(?!(\w+\.)*[A-Z][A-Z0-9_]*$|(frozenset\()?[\[{(]\s*["'][^"']*["'](\s*,\s*["'][^"']*["'])*\s*,?\s*[\]})]\)?$)
      # 定数 (DEFAULTS など) を回すのは、受け取った値ではない
      - metavariable-regex:
          metavariable: $B
          regex: ^(?![A-Z][A-Z0-9_]*$)

  - id: python-html-response-xss
    mode: taint
    languages: [python]
    severity: ERROR
    message: 関数の引数が、エスケープされずに HTMLResponse の HTML に入っています (XSS)。html.escape でエスケープするか、autoescape を有効にした Jinja2 のテンプレートで描画してください。
    metadata:
      category: security
      technology: [fastapi, starlette]
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation"
      confidence: MEDIUM
    pattern-sources: &params
      # backend は層ごとにファイルが分かれ、リクエストの値かを見分けられないため、関数の引数をすべて入口とみなす
      # def のパターンは async def にも一致する
      - patterns:
          - pattern-inside: |
              def $F(..., $P, ...):
                  ...
          - focus-metavariable: $P
          - metavariable-regex:
              metavariable: $P
              regex: ^(?!(self|cls)$)
    pattern-sanitizers:
      - pattern: html.escape(...)
      - pattern: escape(...)
      - pattern: markupsafe.escape(...)
      - pattern: Markup.escape(...)
      - pattern: bleach.clean(...)
      - pattern: nh3.clean(...)
      - pattern: int(...)
      - pattern: float(...)
      # autoescape を有効にした Environment と、Starlette の Jinja2Templates (autoescape が有効) のテンプレートはエスケープされる。
      # Environment() と jinja2.Template は既定で autoescape せず、Markdown の render() は HTML をそのまま通す
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $E = $ENV(..., autoescape=True, ...)
                  ...
              - pattern-inside: |
                  $E = $ENV(..., autoescape=select_autoescape(...), ...)
                  ...
              - pattern-inside: |
                  $E = Jinja2Templates(...)
                  ...
          - pattern-either:
              - pattern: $E.get_template(...).render(...)
              - pattern: $E.from_string(...).render(...)
              - pattern: $E.env.get_template(...).render(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: HTMLResponse($C, ...)
              - pattern: HTMLResponse(..., content=$C, ...)
          - focus-metavariable: $C

  - id: python-jinja2-ssti
    mode: taint
    languages: [python]
    severity: ERROR
    message: 関数の引数を、Jinja2 のテンプレートとして描画しています (テンプレートインジェクション)。{{ ... }} を渡されると、サーバーでコードを実行されます。利用者の入力は、テンプレートではなく render() の値として渡してください。
    metadata:
      category: security
      technology: [jinja2]
      cwe: "CWE-1336: Improper Neutralization of Special Elements Used in a Template Engine"
      confidence: MEDIUM
    pattern-sources: *params
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: jinja2.Template($S, ...)
              - patterns:
                  - pattern: $E.from_string($S, ...)
                  # サンドボックスは、テンプレートからの危険な操作を止める
                  - pattern-not: SandboxedEnvironment(...).from_string(...)
                  - pattern-not-inside: |
                      $E = SandboxedEnvironment(...)
                      ...
          - focus-metavariable: $S

  - id: python-sqlalchemy-exec-driver-sql
    mode: taint
    languages: [python]
    severity: ERROR
    message: 文字列を組み立てた SQL を exec_driver_sql に渡しています (SQL インジェクション)。値はバインドパラメータ (2 つ目の引数) で渡してください。
    metadata:
      category: security
      technology: [sqlalchemy]
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      confidence: MEDIUM
    # text() は r/all の avoid-sqlalchemy-text が同じ考え方で検査する
    pattern-sources:
      - pattern: f"..."
      - pattern: |
          "..." + $X
      - pattern: |
          $X + "..."
      - pattern: |
          "...".format(...)
      - pattern: |
          "..." % $X
      # += でつないだもの。固定の文字列を足すだけ (条件で句を足す書き方) は除く
      - by-side-effect: true
        patterns:
          - pattern: $Q += $Y
          - metavariable-regex:
              metavariable: $Y
              regex: ^(?![rRbBuU]?["'])
          - focus-metavariable: $Q
    pattern-sinks:
      - patterns:
          - pattern: $C.exec_driver_sql($S, ...)
          - focus-metavariable: $S
