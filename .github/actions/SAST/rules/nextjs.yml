rules:
  - id: nextjs-ssrf
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値が外部通信の宛先になっています (SSRF)。宛先を許可リストで検証してください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      confidence: MEDIUM
    pattern-sources: &sources
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  export async function $M($REQ, ...) { ... }
              - pattern-inside: |
                  export function $M($REQ, ...) { ... }
              - pattern-inside: |
                  export default async function $M($REQ, ...) { ... }
              - pattern-inside: |
                  export default function $M($REQ, ...) { ... }
              - pattern-inside: |
                  export const $M = async ($REQ, ...) => { ... }
              - pattern-inside: |
                  export const $M = ($REQ, ...) => { ... }
              - pattern-inside: |
                  export const $M = $WRAP(async ($REQ, ...) => { ... }, ...)
              - pattern-inside: |
                  export const $M = $WRAP(($REQ, ...) => { ... }, ...)
              - pattern-inside: |
                  export const $M = $WRAP(async function ($REQ, ...) { ... }, ...)
              - pattern-inside: |
                  export const $M = $WRAP(function ($REQ, ...) { ... }, ...)
              - pattern-inside: |
                  export const $M = $WRAP($WRAP2(async ($REQ, ...) => { ... }, ...), ...)
              - pattern-inside: |
                  export const $M = $WRAP($WRAP2(($REQ, ...) => { ... }, ...), ...)
              - pattern-inside: |
                  async function $H($REQ, ...) { ... }
                  ...
                  export { $H as $M };
              - pattern-inside: |
                  function $H($REQ, ...) { ... }
                  ...
                  export { $H as $M };
              - pattern-inside: |
                  const $H = async ($REQ, ...) => { ... };
                  ...
                  export { $H as $M };
              - pattern-inside: |
                  const $H = ($REQ, ...) => { ... };
                  ...
                  export { $H as $M };
              - pattern-inside: |
                  async function $M($REQ, ...) { ... }
                  ...
                  export { $M };
              - pattern-inside: |
                  function $M($REQ, ...) { ... }
                  ...
                  export { $M };
              - pattern-inside: |
                  async function $H($REQ, ...) { ... }
                  ...
                  export const $M = $WRAP($H, ...);
              - pattern-inside: |
                  const $H = async ($REQ, ...) => { ... };
                  ...
                  export const $M = $WRAP($H, ...);
              - pattern-inside: |
                  const $H = async ($REQ, ...) => { ... };
                  ...
                  export const $M = $H;
          - metavariable-regex:
              metavariable: $M
              regex: ^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|middleware|proxy)$
          - focus-metavariable: $REQ
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  export async function $M($REQ, $CTX, ...) { ... }
              - pattern-inside: |
                  export function $M($REQ, $CTX, ...) { ... }
              - pattern-inside: |
                  export const $M = async ($REQ, $CTX, ...) => { ... }
              - pattern-inside: |
                  export const $M = ($REQ, $CTX, ...) => { ... }
          - metavariable-regex:
              metavariable: $M
              regex: ^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$
          - focus-metavariable: $CTX
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  export async function $M(...) { ... }
              - pattern-inside: |
                  export default async function $M(...) { ... }
              - pattern-inside: |
                  export default function $M(...) { ... }
              - pattern-inside: |
                  async function $M(...) { ... }
                  ...
                  export default $M;
              - pattern-inside: |
                  function $M(...) { ... }
                  ...
                  export default $M;
          - pattern-either:
              - pattern: searchParams
              - pattern: params
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  export default async function $M($PROPS, ...) { ... }
              - pattern-inside: |
                  export default function $M($PROPS, ...) { ... }
              - pattern-inside: |
                  export async function generateMetadata($PROPS, ...) { ... }
          - pattern-either:
              - pattern: $PROPS.searchParams
              - pattern: $PROPS.params
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  export default async function $M($REQ, $RES, ...) { ... }
              - pattern-inside: |
                  export default function $M($REQ, $RES, ...) { ... }
              - pattern-inside: |
                  export default async ($REQ, $RES, ...) => { ... }
              - pattern-inside: |
                  export default ($REQ, $RES, ...) => { ... }
              - pattern-inside: |
                  export default $WRAP(async ($REQ, $RES, ...) => { ... }, ...)
              - pattern-inside: |
                  export default $WRAP(($REQ, $RES, ...) => { ... }, ...)
              - pattern-inside: |
                  export default $WRAP(async function ($REQ, $RES, ...) { ... }, ...)
              - pattern-inside: |
                  export default $WRAP(function ($REQ, $RES, ...) { ... }, ...)
              - pattern-inside: |
                  async function $H($REQ, $RES, ...) { ... }
                  ...
                  export default $WRAP($H, ...);
              - pattern-inside: |
                  function $H($REQ, $RES, ...) { ... }
                  ...
                  export default $WRAP($H, ...);
              - pattern-inside: |
                  const $H = async ($REQ, $RES, ...) => { ... };
                  ...
                  export default $WRAP($H, ...);
              - pattern-inside: |
                  async function $H($REQ, $RES, ...) { ... }
                  ...
                  export default $H;
              - pattern-inside: |
                  const $H = async ($REQ, $RES, ...) => { ... };
                  ...
                  export default $H;
              - pattern-inside: |
                  function $H($REQ, $RES, ...) { ... }
                  ...
                  export default $H;
              - pattern-inside: |
                  const $H = ($REQ, $RES, ...) => { ... };
                  ...
                  export default $H;
              - pattern-inside: |
                  const $H = ($REQ, $RES, ...) => { ... };
                  ...
                  export default $WRAP($H, ...);
              - pattern-inside: |
                  export default $WRAP($WRAP2(async ($REQ, $RES, ...) => { ... }, ...), ...)
              - pattern-inside: |
                  export default $WRAP($WRAP2(($REQ, $RES, ...) => { ... }, ...), ...)
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  export async function getServerSideProps($CTX, ...) { ... }
              - pattern-inside: |
                  export const getServerSideProps = async ($CTX, ...) => { ... }
              - pattern-inside: |
                  export const getServerSideProps = $WRAP(async ($CTX, ...) => { ... }, ...)
              - pattern-inside: |
                  export const getServerSideProps = $WRAP(async function ($CTX, ...) { ... }, ...)
              - pattern-inside: |
                  export const getServerSideProps = $WRAP($WRAP2(async ($CTX, ...) => { ... }, ...), ...)
              - pattern-inside: |
                  async function $H($CTX, ...) { ... }
                  ...
                  export const getServerSideProps = $H;
              - pattern-inside: |
                  async function $H($CTX, ...) { ... }
                  ...
                  export const getServerSideProps = $WRAP($H, ...);
              - pattern-inside: |
                  const $H = async ($CTX, ...) => { ... };
                  ...
                  export const getServerSideProps = $H;
              - pattern-inside: |
                  const $H = async ($CTX, ...) => { ... };
                  ...
                  export const getServerSideProps = $WRAP($H, ...);
              - pattern-inside: |
                  async function $H($CTX, ...) { ... }
                  ...
                  export { $H as getServerSideProps };
          - focus-metavariable: $CTX
      - patterns:
          - pattern-inside: |
              "use server";
              ...
          - pattern-either:
              - pattern-inside: |
                  export async function $F(..., $P, ...) { ... }
              - pattern-inside: |
                  async function $F(..., $P, ...) { ... }
              - pattern-inside: |
                  export const $F = async (..., $P, ...) => { ... }
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  async function $F(..., $P, ...) { "use server"; ... }
              - pattern-inside: |
                  async (..., $P, ...) => { "use server"; ... }
          - focus-metavariable: $P
      - pattern: headers()
      - pattern: cookies()
      - pattern: useSearchParams()
      - pattern: useParams()
      - pattern: window.location.search
      - pattern: window.location.hash
      - pattern: window.location.href
      - pattern: location.search
      - pattern: location.hash
      - pattern: location.href
      - pattern: document.location.search
      - pattern: document.location.hash
      - pattern: document.location.href
      - pattern: document.URL
      - pattern: document.documentURI
      - pattern: document.referrer
      - pattern: window.name
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
    pattern-sinks:
      - patterns:
          - pattern-either: &ssrf-calls
              - pattern: fetch($URL, ...)
              - pattern: axios($URL, ...)
              - pattern: got($URL, ...)
              - pattern: ky($URL, ...)
              - pattern: request($URL, ...)
              - patterns:
                  - pattern: $CLIENT.$METHOD($URL, ...)
                  - metavariable-regex:
                      metavariable: $CLIENT
                      regex: ^(axios|got|ky|superagent|needle)$
              - patterns:
                  - pattern: $CLIENT.$METHOD($URL, ...)
                  - metavariable-regex:
                      metavariable: $CLIENT
                      regex: ^(http|https|undici|globalThis|window|self)$
                  - metavariable-regex:
                      metavariable: $METHOD
                      regex: ^(get|request|fetch|stream)$
          - focus-metavariable: $URL
          # 宛先のホストが固定の URL (パスだけが変わる) は SSRF にしない。`${x}/ で始まるものは次の sink で x だけを見る
          - metavariable-regex:
              metavariable: $URL
              regex: ^(?!`(https?://[^/$`]+/|\$\{[^}]+\}/(?![/\\])))
      - patterns:
          - pattern-either: *ssrf-calls
          - metavariable-regex:
              metavariable: $URL
              regex: ^`\$\{[^}]+\}/(?![/\\])
          - metavariable-pattern:
              metavariable: $URL
              pattern: |
                `${$HOST}...`
          - focus-metavariable: $HOST

  - id: nextjs-path-traversal
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値がファイルパスに使われています (パストラバーサル)。path.basename や許可リストで検証してください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      confidence: MEDIUM
    pattern-sources: *sources
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: path.basename(...)
      - pattern: basename(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $F($P, ...)
              - pattern: $FS.$F($P, ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(readFile|readFileSync|writeFile|writeFileSync|appendFile|appendFileSync|createReadStream|createWriteStream|unlink|unlinkSync|readdir|readdirSync|copyFile|copyFileSync|rm|rmSync)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: $F($A, $P, ...)
              - pattern: $FS.$F($A, $P, ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(copyFile|copyFileSync)$
          - focus-metavariable: $P
      # 他のオブジェクトにもある名前は、fs のものだけを見る。rename などは宛先もパスなので全部の引数を見る (コールバックは除く)
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $FS.$F(..., $P, ...)
                  - metavariable-regex:
                      metavariable: $FS
                      regex: ^(fs|fsp|fse|fsPromises|fs\.promises|promises)$
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          import { ..., $F, ... } from "$MOD";
                          ...
                      - pattern-inside: |
                          const { ..., $F, ... } = require("$MOD");
                          ...
                  - pattern: $F(..., $P, ...)
                  - metavariable-regex:
                      metavariable: $MOD
                      regex: ^(node:)?fs(/promises)?$
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          import * as $NS from "$MOD";
                          ...
                      - pattern-inside: |
                          import $NS from "$MOD";
                          ...
                      - pattern-inside: |
                          const $NS = require("$MOD");
                          ...
                  - pattern: $NS.$F(..., $P, ...)
                  - metavariable-regex:
                      metavariable: $MOD
                      regex: ^(node:)?fs(/promises)?$
          - metavariable-regex:
              metavariable: $F
              regex: ^(open|openSync|stat|statSync|lstat|lstatSync|access|accessSync|exists|existsSync|rename|renameSync|mkdir|mkdirSync|rmdir|rmdirSync|cp|cpSync|symlink|symlinkSync|link|linkSync|truncate|truncateSync|chmod|chmodSync|chown|chownSync)$
          - metavariable-regex:
              metavariable: $P
              regex: ^(?!\([^()]*\)\s*(:[^=]+)?=>|async\b|function\b|[\w$]+\s*=>)
          - focus-metavariable: $P

  - id: nextjs-sql-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値が SQL の文字列に入っています (SQL インジェクション)。プレースホルダを使ってください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      confidence: MEDIUM
    pattern-sources: *sources
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
    pattern-sinks:
      - patterns:
          - pattern: $DB.$M($S, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(query|execute|raw|unsafe|prepare|\$queryRawUnsafe|\$executeRawUnsafe|whereRaw|orderByRaw|havingRaw|joinRaw|groupByRaw|fromRaw)$
          - focus-metavariable: $S
          # オブジェクトを渡す API (GraphQL など) は、下の text / sql だけを SQL として見る
          - metavariable-regex:
              metavariable: $S
              regex: ^[^{]
      - patterns:
          - pattern-either:
              - pattern: |
                  $DB.query({..., text: $S, ...}, ...)
              - pattern: |
                  $DB.query({..., sql: $S, ...}, ...)
              - pattern: |
                  $DB.execute({..., text: $S, ...}, ...)
              - pattern: |
                  $DB.execute({..., sql: $S, ...}, ...)
          - focus-metavariable: $S
      # Map.get や RegExp.exec と同じ名前なので、引数が SQL の文字列のときだけ見る
      - patterns:
          - pattern: $DB.$M($S, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(run|exec|all|get|each)$
          - metavariable-regex:
              metavariable: $S
              regex: (?i)^[`"']\s*(SELECT|INSERT|UPDATE|DELETE|WITH|REPLACE|DROP|ALTER|CREATE|PRAGMA)\b
          - focus-metavariable: $S

  - id: nextjs-open-redirect
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値がリダイレクト先になっています (オープンリダイレクト)。同じサイト内のパスであることを検証してください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-601: URL Redirection to Untrusted Site"
      confidence: MEDIUM
    pattern-sources: *sources
    pattern-sanitizers: &same-site
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      # 固定のパス (// で始まらず、連結もしない) をリクエストの URL に解決するだけなら、ホストを変えられない
      - patterns:
          - pattern: new URL($PATH, $BASE)
          - metavariable-regex:
              metavariable: $PATH
              regex: ^("/([^/\\"][^"]*)?"|'/([^/\\'][^']*)?'|`/[^/`$\\][^`]*)$
          - metavariable-regex:
              metavariable: $BASE
              regex: ^(req|request)\.(url|nextUrl(\.origin|\.href)?)$
      # 固定のパスかクエリで始まるテンプレートは、サイトの外へ飛ばせない (// と /${x} と連結は除く)。
      # Semgrep が見るテンプレートの範囲は閉じのバッククォートを含まないため、バッククォートなしで行末まで一致させる
      - patterns:
          - pattern: $T
          - metavariable-regex:
              metavariable: $T
              regex: ^`(/[^/`$\\]|[?#])[^`]*$
    pattern-sinks:
      - patterns:
          - pattern-either: &redirect-calls
              - pattern: redirect($U, ...)
              - pattern: permanentRedirect($U, ...)
              - pattern: $RES.redirect($U, ...)
              - pattern: $RES.redirect($CODE, $U)
              - pattern: router.push($U, ...)
              - pattern: router.replace($U, ...)
              - pattern: location.assign($U)
              - pattern: location.replace($U)
              - pattern: location.href = $U
              - pattern: location = $U
              - pattern: window.location.assign($U)
              - pattern: window.location.replace($U)
              - pattern: window.location.href = $U
              - pattern: window.location = $U
              - pattern: document.location.assign($U)
              - pattern: document.location.replace($U)
              - pattern: document.location.href = $U
              - pattern: document.location = $U
              - pattern: window.open($U, ...)
          - focus-metavariable: $U
          # `${x}?... や `${x}/固定の文字列 で始まるものは、宛先を決める x だけを次の sink で見る。
          # `${x}/${y} は x が / だと //y になりサイトの外へ飛ぶので、全体を見る。オブジェクトは下の sink で宛先のキーだけを見る
          - metavariable-regex:
              metavariable: $U
              regex: ^(?!\{|`\$\{[^}]+\}(/[^/\\`$?#]+([/?#][^`]*)?|[?#][^`]*)$)
      - patterns:
          - pattern-either: *redirect-calls
          - metavariable-regex:
              metavariable: $U
              regex: ^`\$\{[^}]+\}(/[^/\\`$?#]+([/?#][^`]*)?|[?#][^`]*)$
          - metavariable-pattern:
              metavariable: $U
              pattern: |
                `${$HEAD}...`
          - focus-metavariable: $HEAD
      - patterns:
          - pattern: |
              new $R($B, {..., headers: {..., $H: $U, ...}, ...})
          - metavariable-regex:
              metavariable: $R
              regex: ^(Response|NextResponse)$
          - metavariable-regex:
              metavariable: $H
              regex: (?i)^["']?location["']?$
          - focus-metavariable: $U
      - patterns:
          - pattern: $HEADERS.$M($H, $U)
          - metavariable-regex:
              metavariable: $M
              regex: ^(set|append|setHeader)$
          - metavariable-regex:
              metavariable: $H
              regex: (?i)^["'`]location["'`]$
          - focus-metavariable: $U
      - patterns:
          - pattern: |
              $RES.writeHead($CODE, {..., $H: $U, ...})
          - metavariable-regex:
              metavariable: $H
              regex: (?i)^["']?location["']?$
          - focus-metavariable: $U
      - patterns:
          - pattern: |
              ({..., redirect: {..., destination: $U, ...}, ...})
          - focus-metavariable: $U
      - patterns:
          - pattern-either:
              - pattern: |
                  redirect({..., $K: $U, ...}, ...)
              - pattern: |
                  permanentRedirect({..., $K: $U, ...}, ...)
              - pattern: |
                  $RES.redirect({..., $K: $U, ...}, ...)
              - pattern: |
                  router.push({..., $K: $U, ...}, ...)
              - pattern: |
                  router.replace({..., $K: $U, ...}, ...)
          - metavariable-regex:
              metavariable: $K
              regex: ^["']?(pathname|host|hostname|protocol|href)["']?$
          - focus-metavariable: $U
      - patterns:
          - pattern-either:
              - pattern: |
                  redirect({..., ...$U, ...}, ...)
              - pattern: |
                  permanentRedirect({..., ...$U, ...}, ...)
              - pattern: |
                  $RES.redirect({..., ...$U, ...}, ...)
              - pattern: |
                  router.push({..., ...$U, ...}, ...)
              - pattern: |
                  router.replace({..., ...$U, ...}, ...)
          - focus-metavariable: $U

  - id: nextjs-rewrite
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値が rewrite の宛先になっています (SSRF)。同じサイト内の固定のパスにしてください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      confidence: MEDIUM
    pattern-sources: *sources
    pattern-sanitizers: *same-site
    pattern-sinks:
      - patterns:
          - pattern: NextResponse.rewrite($U, ...)
          - focus-metavariable: $U

  - id: nextjs-command-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値がシェルのコマンドに入っています (コマンドインジェクション)。execFile で引数を分けて渡してください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      confidence: HIGH
    pattern-sources: *sources
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
    pattern-sinks:
      - patterns:
          - pattern: $F($C, ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(exec|execSync|execAsync|execPromise|execP|execFile|execFileSync|spawn|spawnSync|fork|execaCommand|execaCommandSync)$
          - focus-metavariable: $C
      # RegExp.exec と同じ名前の exec は、child_process のものだけを見る
      - patterns:
          - pattern-either:
              - pattern: child_process.exec($C, ...)
              - pattern: cp.exec($C, ...)
              - pattern: shell.exec($C, ...)
              - patterns:
                  - pattern: $NS.$F($C, ...)
                  - metavariable-regex:
                      metavariable: $F
                      regex: ^(execSync|execFile|execFileSync|spawn|spawnSync|fork|execaCommand|execaCommandSync)$
          - focus-metavariable: $C
      - patterns:
          - pattern-either:
              - pattern: |
                  $F($X, $C, {..., shell: $SHELL, ...})
              - pattern: |
                  $NS.$F($X, $C, {..., shell: $SHELL, ...})
          - metavariable-regex:
              metavariable: $F
              regex: ^(spawn|spawnSync|execFile|execFileSync)$
          - metavariable-regex:
              metavariable: $SHELL
              regex: ^(?!false$)
          - focus-metavariable: $C
      - patterns:
          - pattern-either:
              - pattern: |
                  $F($SH, [..., $FLAG, $C, ...], ...)
              - pattern: |
                  $NS.$F($SH, [..., $FLAG, $C, ...], ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(spawn|spawnSync|execFile|execFileSync)$
          - metavariable-regex:
              metavariable: $SH
              regex: ^["'`](/bin/|/usr/bin/)?(ba|z|da|k|a)?sh["'`]$
          - metavariable-regex:
              metavariable: $FLAG
              regex: ^["'`]-[a-zA-Z]*c[a-zA-Z]*["'`]$
          - focus-metavariable: $C

  - id: nextjs-code-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値がコードとして実行されます (コードインジェクション)。eval や new Function を使わないでください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      confidence: HIGH
    pattern-sources: *sources
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($C)
              - pattern: new Function(..., $C)
              - pattern: new vm.Script($C, ...)
              - pattern: require($C)
              - pattern: import($C)
              - patterns:
                  - pattern: vm.$M($C, ...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(runInNewContext|runInThisContext|runInContext|compileFunction)$
              # 関数を渡す普通の使い方は見ない
              - patterns:
                  - pattern: $TIMER($C, ...)
                  - metavariable-regex:
                      metavariable: $TIMER
                      regex: ^(setTimeout|setInterval)$
                  - metavariable-regex:
                      metavariable: $C
                      regex: ^(?!\([^()]*\)\s*(:[^=]+)?=>|async\b|function\b|[\w$]+\s*=>)
          - focus-metavariable: $C

  - id: nextjs-xss
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値がエスケープされずに HTML になります (XSS)。DOMPurify などでサニタイズしてください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation"
      confidence: HIGH
    pattern-sources: *sources
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: DOMPurify.sanitize(...)
      - pattern: sanitizeHtml(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: |
                  <$E dangerouslySetInnerHTML={{__html: $X}} />
              - pattern: |
                  <$E dangerouslySetInnerHTML={{__html: $X}}>...</$E>
              - pattern: |
                  ({dangerouslySetInnerHTML: {__html: $X}})
              - pattern: |
                  <$E srcDoc={$X} />
              - pattern: |
                  <$E srcDoc={$X}>...</$E>
              - pattern: document.write($X)
              - pattern: document.writeln($X)
              - pattern: $EL.innerHTML = $X
              - pattern: $EL.outerHTML = $X
              - pattern: $EL.insertAdjacentHTML($POS, $X)
          - focus-metavariable: $X
      - patterns:
          - pattern: |
              new $R($X, {..., headers: {..., $H: $V, ...}, ...})
          - metavariable-regex:
              metavariable: $R
              regex: ^(Response|NextResponse)$
          - metavariable-regex:
              metavariable: $H
              regex: (?i)^["']?content-type["']?$
          - metavariable-regex:
              metavariable: $V
              regex: (?i)^["'`]text/html
          - focus-metavariable: $X

  - id: nextjs-xss-url
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値がリンクや埋め込みの URL になっています (javascript スキームなどの XSS)。同じサイト内のパスであることを検証してください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation"
      confidence: MEDIUM
    pattern-sources: *sources
    pattern-sanitizers: *same-site
    pattern-sinks:
      - patterns:
          - pattern-either: &url-attrs
              - pattern: |
                  <$E href={$X} />
              - pattern: |
                  <$E href={$X}>...</$E>
          # Link の href のオブジェクトは、下の sink で宛先のキーだけを見る。
          # `${x}?... や `${x}/固定の文字列 で始まるものは、宛先を決める x だけを次の sink で見る
          - metavariable-regex:
              metavariable: $X
              regex: ^(?!\{|`\$\{[^}]+\}(/[^/\\`$?#]+([/?#][^`]*)?|[?#][^`]*)$)
          - focus-metavariable: $X
      - patterns:
          - pattern-either: *url-attrs
          - metavariable-regex:
              metavariable: $X
              regex: ^`\$\{[^}]+\}(/[^/\\`$?#]+([/?#][^`]*)?|[?#][^`]*)$
          - metavariable-pattern:
              metavariable: $X
              pattern: |
                `${$HEAD}...`
          - focus-metavariable: $HEAD
      - patterns:
          - pattern-either:
              - pattern: |
                  <$E href={{..., $K: $X, ...}} />
              - pattern: |
                  <$E href={{..., $K: $X, ...}}>...</$E>
          - metavariable-regex:
              metavariable: $K
              regex: ^["']?(pathname|host|hostname|protocol|href)["']?$
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: |
                  <$E href={{..., ...$X, ...}} />
              - pattern: |
                  <$E href={{..., ...$X, ...}}>...</$E>
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: |
                  <$E src={$X} />
              - pattern: |
                  <$E src={$X}>...</$E>
          - metavariable-regex:
              metavariable: $E
              regex: ^(iframe|script|Script|embed)$
          - focus-metavariable: $X
