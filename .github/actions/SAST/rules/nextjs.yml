rules:
  - id: nextjs-ssrf
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値が外部通信の宛先になっています (SSRF)。宛先を許可リストで検証してください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      confidence: MEDIUM
    pattern-sources: &sources
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  export async function $M($REQ, ...) { ... }
              - pattern-inside: |
                  export function $M($REQ, ...) { ... }
              - pattern-inside: |
                  export const $M = async ($REQ, ...) => { ... }
              - pattern-inside: |
                  export const $M = ($REQ, ...) => { ... }
          - metavariable-regex:
              metavariable: $M
              regex: ^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|middleware|proxy)$
          - focus-metavariable: $REQ
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  export async function $M(...) { ... }
              - pattern-inside: |
                  export default async function $M(...) { ... }
              - pattern-inside: |
                  export default function $M(...) { ... }
          - pattern-either:
              - pattern: searchParams
              - pattern: params
      - patterns:
          - pattern-inside: |
              "use server";
              ...
          - pattern-either:
              - pattern-inside: |
                  export async function $F(..., $P, ...) { ... }
              - pattern-inside: |
                  async function $F(..., $P, ...) { ... }
              - pattern-inside: |
                  export const $F = async (..., $P, ...) => { ... }
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  async function $F(..., $P, ...) { "use server"; ... }
              - pattern-inside: |
                  async (..., $P, ...) => { "use server"; ... }
          - focus-metavariable: $P
      - pattern: headers()
      - pattern: cookies()
      - pattern: useSearchParams()
      - pattern: useParams()
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      # 固定のパス (// で始まらず、連結もしない) をリクエストの URL に解決するだけなら、ホストを変えられない
      - patterns:
          - pattern: new URL($PATH, $BASE)
          - metavariable-regex:
              metavariable: $PATH
              regex: ^("/([^/\\"][^"]*)?"|'/([^/\\'][^']*)?'|`/[^/`$\\][^`]*)$
          - metavariable-regex:
              metavariable: $BASE
              regex: ^(req|request)\.(url|nextUrl(\.origin|\.href)?)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($URL, ...)
              - pattern: axios($URL, ...)
              - pattern: axios.$METHOD($URL, ...)
              - pattern: got($URL, ...)
              - pattern: ky($URL, ...)
              - pattern: request($URL, ...)
              # 外部の URL へ rewrite すると、Next.js のサーバーがそこへ取りに行く (プロキシになる)
              - pattern: NextResponse.rewrite($URL, ...)
          - focus-metavariable: $URL
          # 宛先のホストが固定の URL (パスだけが変わる) は SSRF にしない
          - metavariable-regex:
              metavariable: $URL
              regex: ^(?!`(https?://[^/$`]+/|\$\{[A-Z][A-Z0-9_]*\}/|\$\{process\.env\.\w+\}/))

  - id: nextjs-path-traversal
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値がファイルパスに使われています (パストラバーサル)。path.basename や許可リストで検証してください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      confidence: MEDIUM
    pattern-sources: *sources
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: path.basename(...)
      - pattern: basename(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: readFile($P, ...)
              - pattern: readFileSync($P, ...)
              - pattern: writeFile($P, ...)
              - pattern: writeFileSync($P, ...)
              - pattern: createReadStream($P, ...)
              - pattern: createWriteStream($P, ...)
              - pattern: unlink($P, ...)
              - pattern: rm($P, ...)
              - pattern: $FS.readFile($P, ...)
              - pattern: $FS.readFileSync($P, ...)
              - pattern: $FS.writeFile($P, ...)
              - pattern: $FS.writeFileSync($P, ...)
              - pattern: $FS.createReadStream($P, ...)
              - pattern: $FS.createWriteStream($P, ...)
              - pattern: $FS.unlink($P, ...)
              - pattern: $FS.rm($P, ...)
          - focus-metavariable: $P
      # 下の関数は名前がありふれているため、fs から import した名前か、fs のオブジェクトから呼んだときに限る
      - patterns:
          - pattern-inside: |
              import { $F } from "$MOD";
              ...
          - metavariable-regex:
              metavariable: $MOD
              regex: ^(node:)?fs(/promises)?$
          - pattern: $F($P, ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(readdir|opendir|stat|lstat|mkdir|rmdir|rename|copyFile|cp|appendFile|access|truncate)(Sync)?$
          - focus-metavariable: $P
      - patterns:
          - pattern: $FS.$F($P, ...)
          - metavariable-regex:
              metavariable: $FS
              regex: ^(fs|fsp|fsPromises|promises|fs\.promises)$
          - metavariable-regex:
              metavariable: $F
              regex: ^(readdir|opendir|stat|lstat|mkdir|rmdir|rename|copyFile|cp|appendFile|access|truncate)(Sync)?$
          - focus-metavariable: $P

  - id: nextjs-sql-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値が SQL の文字列に入っています (SQL インジェクション)。プレースホルダを使ってください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      confidence: MEDIUM
    pattern-sources: *sources
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($S, ...)
              - pattern: $DB.execute($S, ...)
              - pattern: $DB.raw($S, ...)
              - pattern: $DB.unsafe($S, ...)
              - pattern: $DB.$queryRawUnsafe($S, ...)
              - pattern: $DB.$executeRawUnsafe($S, ...)
          - focus-metavariable: $S
          # オブジェクトを渡す API (GraphQL など) は、下の text / sql だけを SQL として見る
          - metavariable-regex:
              metavariable: $S
              regex: ^[^{]
      - patterns:
          - pattern-either:
              - pattern: |
                  $DB.query({..., text: $S, ...}, ...)
              - pattern: |
                  $DB.query({..., sql: $S, ...}, ...)
              - pattern: |
                  $DB.execute({..., text: $S, ...}, ...)
              - pattern: |
                  $DB.execute({..., sql: $S, ...}, ...)
          - focus-metavariable: $S

  - id: nextjs-open-redirect
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値がリダイレクト先になっています (オープンリダイレクト)。同じサイト内のパスであることを検証してください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-601: URL Redirection to Untrusted Site"
      confidence: MEDIUM
    pattern-sources: *sources
    pattern-sanitizers:
      - pattern: encodeURIComponent(...)
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      # 固定のパス (// で始まらず、連結もしない) をリクエストの URL に解決するだけなら、ホストを変えられない
      - patterns:
          - pattern: new URL($PATH, $BASE)
          - metavariable-regex:
              metavariable: $PATH
              regex: ^("/([^/\\"][^"]*)?"|'/([^/\\'][^']*)?'|`/[^/`$\\][^`]*)$
          - metavariable-regex:
              metavariable: $BASE
              regex: ^(req|request)\.(url|nextUrl(\.origin|\.href)?)$
      # 固定のパスで始まるテンプレートは、サイトの外へ飛ばせない (// と /${x} と連結は除く)。
      # Semgrep が見るテンプレートの範囲は閉じのバッククォートを含まないため、バッククォートなしで行末まで一致させる
      - patterns:
          - pattern: $T
          - metavariable-regex:
              metavariable: $T
              regex: ^`/[^/`$\\][^`]*$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: redirect($U, ...)
              - pattern: permanentRedirect($U, ...)
              - pattern: NextResponse.redirect($U, ...)
              - pattern: Response.redirect($U, ...)
              - pattern: router.push($U, ...)
              - pattern: router.replace($U, ...)
              - pattern: window.location.assign($U)
              - pattern: window.location.replace($U)
              - pattern: window.location.href = $U
              - pattern: window.location = $U
              - pattern: location.assign($U)
              - pattern: location.replace($U)
              - pattern: location.href = $U
              - pattern: window.open($U, ...)
          - focus-metavariable: $U

  - id: nextjs-command-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値がシェルのコマンドに入っています (コマンドインジェクション)。execFile で引数を分けて渡してください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      confidence: HIGH
    pattern-sources: *sources
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: exec($C, ...)
              - pattern: execSync($C, ...)
              - pattern: child_process.exec($C, ...)
              - pattern: child_process.execSync($C, ...)
          - focus-metavariable: $C
      # sh -c に渡した文字列は、シェルのコマンドとして解釈される
      - patterns:
          - pattern-either:
              - pattern: $SPAWN($SH, ["-c", $C, ...], ...)
              - pattern: $CP.$SPAWN($SH, ["-c", $C, ...], ...)
          - metavariable-regex:
              metavariable: $SPAWN
              regex: ^(spawn|spawnSync|execFile|execFileSync)$
          - metavariable-regex:
              metavariable: $SH
              regex: ^["'`](/bin/|/usr/bin/)?(sh|bash|zsh|dash)["'`]$
          - focus-metavariable: $C
      # shell: true だと、コマンドも引数もつないでシェルが解釈する
      - patterns:
          - pattern-either:
              - pattern: |
                  $SPAWN($C, {..., shell: true, ...})
              - pattern: |
                  $SPAWN($C, $ARGS, {..., shell: true, ...}, ...)
              - pattern: |
                  $CP.$SPAWN($C, {..., shell: true, ...})
              - pattern: |
                  $CP.$SPAWN($C, $ARGS, {..., shell: true, ...}, ...)
          - metavariable-regex:
              metavariable: $SPAWN
              regex: ^(spawn|spawnSync|execFile|execFileSync)$
          - focus-metavariable: $C
      - patterns:
          - pattern-either:
              - pattern: |
                  $SPAWN($C, $ARGS, {..., shell: true, ...}, ...)
              - pattern: |
                  $CP.$SPAWN($C, $ARGS, {..., shell: true, ...}, ...)
          - metavariable-regex:
              metavariable: $SPAWN
              regex: ^(spawn|spawnSync|execFile|execFileSync)$
          - focus-metavariable: $ARGS

  - id: nextjs-code-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値がコードとして実行されます (コードインジェクション)。eval や new Function を使わないでください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      confidence: HIGH
    pattern-sources: *sources
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($C)
              - pattern: new Function(..., $C)
              - pattern: vm.runInNewContext($C, ...)
              - pattern: vm.runInThisContext($C, ...)
              - pattern: vm.runInContext($C, ...)
              - pattern: vm.compileFunction($C, ...)
              - pattern: new vm.Script($C, ...)
              - pattern: runInNewContext($C, ...)
              - pattern: runInThisContext($C, ...)
              - pattern: runInContext($C, ...)
          - focus-metavariable: $C

  - id: nextjs-xss
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値がエスケープされずに HTML になります (XSS)。DOMPurify などでサニタイズしてください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation"
      confidence: HIGH
    pattern-sources: *sources
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: DOMPurify.sanitize(...)
      - pattern: sanitizeHtml(...)
      # < をすべて置き換えると、タグを作れない (Next.js の JSON-LD の書き方: JSON.stringify(x).replace(/</g, "\\u003c"))
      - pattern: $S.replace(/</g, ...)
      - pattern: $S.replaceAll("<", ...)
      - pattern: $S.replaceAll(/</g, ...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: |
                  <$E dangerouslySetInnerHTML={{__html: $X}} />
              - pattern: |
                  <$E dangerouslySetInnerHTML={{__html: $X}}>...</$E>
          - focus-metavariable: $X

  - id: nextjs-image-any-host
    languages: [typescript, javascript]
    severity: ERROR
    message: next/image のサーバーが、どのホストの画像でも取りに行きます (SSRF)。images.remotePatterns は必要なホストだけにし、dangerouslyAllowLocalIP は使わないでください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      confidence: HIGH
    pattern-either:
      - patterns:
          - pattern-inside: |
              {..., remotePatterns: [...], ...}
          - pattern: |
              {..., hostname: "**", ...}
      - patterns:
          - pattern-inside: |
              {..., remotePatterns: [...], ...}
          - pattern: new URL($U)
          - metavariable-regex:
              metavariable: $U
              regex: ^["'`]https?://\*\*([/:"'`]|$)
      - pattern: |
          {..., dangerouslyAllowLocalIP: true, ...}

  - id: nextjs-public-env-secret
    languages: [typescript, javascript]
    severity: ERROR
    message: NEXT_PUBLIC_ で始まる環境変数は、ビルド時にブラウザ向けの JS に埋め込まれ、誰でも読めます。秘密の値は NEXT_PUBLIC_ を付けない名前にし、サーバーだけで読んでください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-540: Inclusion of Sensitive Information in Source Code"
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: process.env.$NAME
          - pattern: process.env["$NAME"]
      # 秘密の値を表す語で終わる名前 (NEXT_PUBLIC_IS_PRIVATE_BETA や NEXT_PUBLIC_OAUTH_TOKEN_URL は除く)
      - metavariable-regex:
          metavariable: $NAME
          regex: ^NEXT_PUBLIC_(\w+_)?(SECRET|SECRET_KEY|PRIVATE_KEY|PASSWORD|PASSWD|CREDENTIALS?|SERVICE_ROLE|SERVICE_ROLE_KEY|TOKEN|ACCESS_KEY)$
