rules:
  - id: nextjs-ssrf
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値が外部通信の宛先になっています (SSRF)。宛先を許可リストで検証してください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      confidence: MEDIUM
    pattern-sources: &sources
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  export async function $M($REQ, ...) { ... }
              - pattern-inside: |
                  export function $M($REQ, ...) { ... }
              - pattern-inside: |
                  export default async function $M($REQ, ...) { ... }
              - pattern-inside: |
                  export default function $M($REQ, ...) { ... }
              - pattern-inside: |
                  export const $M = async ($REQ, ...) => { ... }
              - pattern-inside: |
                  export const $M = ($REQ, ...) => { ... }
              - pattern-inside: |
                  export const $M = $WRAP(async ($REQ, ...) => { ... }, ...)
              - pattern-inside: |
                  export const $M = $WRAP(($REQ, ...) => { ... }, ...)
              - pattern-inside: |
                  async function $H($REQ, ...) { ... }
                  ...
                  export { $H as $M };
              - pattern-inside: |
                  const $H = async ($REQ, ...) => { ... };
                  ...
                  export { $H as $M };
              - pattern-inside: |
                  async function $H($REQ, ...) { ... }
                  ...
                  export const $M = $WRAP($H, ...);
              - pattern-inside: |
                  const $H = async ($REQ, ...) => { ... };
                  ...
                  export const $M = $WRAP($H, ...);
          - metavariable-regex:
              metavariable: $M
              regex: ^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|middleware|proxy)$
          - focus-metavariable: $REQ
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  export async function $M($REQ, $CTX, ...) { ... }
              - pattern-inside: |
                  export function $M($REQ, $CTX, ...) { ... }
              - pattern-inside: |
                  export const $M = async ($REQ, $CTX, ...) => { ... }
              - pattern-inside: |
                  export const $M = ($REQ, $CTX, ...) => { ... }
          - metavariable-regex:
              metavariable: $M
              regex: ^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$
          - focus-metavariable: $CTX
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  export async function $M(...) { ... }
              - pattern-inside: |
                  export default async function $M(...) { ... }
              - pattern-inside: |
                  export default function $M(...) { ... }
              - pattern-inside: |
                  async function $M(...) { ... }
                  ...
                  export default $M;
              - pattern-inside: |
                  function $M(...) { ... }
                  ...
                  export default $M;
          - pattern-either:
              - pattern: searchParams
              - pattern: params
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  export default async function $M($PROPS, ...) { ... }
              - pattern-inside: |
                  export default function $M($PROPS, ...) { ... }
              - pattern-inside: |
                  export async function generateMetadata($PROPS, ...) { ... }
          - pattern-either:
              - pattern: $PROPS.searchParams
              - pattern: $PROPS.params
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  export default async function $M($REQ, $RES, ...) { ... }
              - pattern-inside: |
                  export default function $M($REQ, $RES, ...) { ... }
              - pattern-inside: |
                  export default async ($REQ, $RES, ...) => { ... }
              - pattern-inside: |
                  export default ($REQ, $RES, ...) => { ... }
              - pattern-inside: |
                  export default $WRAP(async ($REQ, $RES, ...) => { ... }, ...)
              - pattern-inside: |
                  async function $H($REQ, $RES, ...) { ... }
                  ...
                  export default $WRAP($H, ...);
              - pattern-inside: |
                  function $H($REQ, $RES, ...) { ... }
                  ...
                  export default $WRAP($H, ...);
              - pattern-inside: |
                  const $H = async ($REQ, $RES, ...) => { ... };
                  ...
                  export default $WRAP($H, ...);
              - pattern-inside: |
                  async function $H($REQ, $RES, ...) { ... }
                  ...
                  export default $H;
              - pattern-inside: |
                  function $H($REQ, $RES, ...) { ... }
                  ...
                  export default $H;
              - pattern-inside: |
                  const $H = async ($REQ, $RES, ...) => { ... };
                  ...
                  export default $H;
              - pattern-inside: |
                  const $H = ($REQ, $RES, ...) => { ... };
                  ...
                  export default $H;
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  export async function getServerSideProps($CTX, ...) { ... }
              - pattern-inside: |
                  export const getServerSideProps = async ($CTX, ...) => { ... }
              - pattern-inside: |
                  export const getServerSideProps = $WRAP(async ($CTX, ...) => { ... }, ...)
          - focus-metavariable: $CTX
      - patterns:
          - pattern-inside: |
              "use server";
              ...
          - pattern-either:
              - pattern-inside: |
                  export async function $F(..., $P, ...) { ... }
              - pattern-inside: |
                  async function $F(..., $P, ...) { ... }
              - pattern-inside: |
                  export const $F = async (..., $P, ...) => { ... }
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  async function $F(..., $P, ...) { "use server"; ... }
              - pattern-inside: |
                  async (..., $P, ...) => { "use server"; ... }
          - focus-metavariable: $P
      - pattern: headers()
      - pattern: cookies()
      - pattern: useSearchParams()
      - pattern: useParams()
      - pattern: window.location.search
      - pattern: window.location.hash
      - pattern: window.location.href
      - pattern: location.search
      - pattern: location.hash
      - pattern: location.href
      - pattern: document.referrer
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
    pattern-sinks:
      - patterns:
          - pattern-either: &ssrf-calls
              - pattern: fetch($URL, ...)
              - pattern: axios($URL, ...)
              - pattern: got($URL, ...)
              - pattern: ky($URL, ...)
              - pattern: request($URL, ...)
              - patterns:
                  - pattern: $CLIENT.$METHOD($URL, ...)
                  - metavariable-regex:
                      metavariable: $CLIENT
                      regex: ^(axios|got|ky)$
              - patterns:
                  - pattern: $CLIENT.$METHOD($URL, ...)
                  - metavariable-regex:
                      metavariable: $CLIENT
                      regex: ^(http|https|undici)$
                  - metavariable-regex:
                      metavariable: $METHOD
                      regex: ^(get|request|fetch)$
          - focus-metavariable: $URL
          # 宛先のホストが固定の URL (パスだけが変わる) は SSRF にしない。`${x}/ で始まるものは次の sink で x だけを見る
          - metavariable-regex:
              metavariable: $URL
              regex: ^(?!`(https?://[^/$`]+/|\$\{[^}]+\}/(?![/\\])))
      - patterns:
          - pattern-either: *ssrf-calls
          - metavariable-regex:
              metavariable: $URL
              regex: ^`\$\{[^}]+\}/(?![/\\])
          - metavariable-pattern:
              metavariable: $URL
              pattern: |
                `${$HOST}...`
          - focus-metavariable: $HOST

  - id: nextjs-path-traversal
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値がファイルパスに使われています (パストラバーサル)。path.basename や許可リストで検証してください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      confidence: MEDIUM
    pattern-sources: *sources
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: path.basename(...)
      - pattern: basename(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $F($P, ...)
              - pattern: $FS.$F($P, ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(readFile|readFileSync|writeFile|writeFileSync|appendFile|appendFileSync|createReadStream|createWriteStream|unlink|unlinkSync|readdir|readdirSync|copyFile|copyFileSync|rm|rmSync)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: $F($A, $P, ...)
              - pattern: $FS.$F($A, $P, ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(copyFile|copyFileSync)$
          - focus-metavariable: $P
      # 他のオブジェクトにもある名前は、fs のものだけを見る。rename などは宛先もパスなので全部の引数を見る (コールバックは除く)
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $FS.$F(..., $P, ...)
                  - metavariable-regex:
                      metavariable: $FS
                      regex: ^(fs|fsp|fsPromises|fs\.promises|promises)$
              - patterns:
                  - pattern-inside: |
                      import { ..., $F, ... } from "$MOD";
                      ...
                  - pattern: $F(..., $P, ...)
                  - metavariable-regex:
                      metavariable: $MOD
                      regex: ^(node:)?fs(/promises)?$
          - metavariable-regex:
              metavariable: $F
              regex: ^(open|opendir|stat|lstat|access|exists|rename|mkdir|rmdir|cp|truncate)(Sync)?$
          - metavariable-regex:
              metavariable: $P
              regex: ^(?!\([^()]*\)\s*(:[^=]+)?=>|async\b|function\b|[\w$]+\s*=>)
          - focus-metavariable: $P

  - id: nextjs-sql-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値が SQL の文字列に入っています (SQL インジェクション)。プレースホルダを使ってください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      confidence: MEDIUM
    pattern-sources: *sources
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
    pattern-sinks:
      - patterns:
          - pattern: $DB.$M($S, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(query|execute|raw|unsafe|prepare|\$queryRawUnsafe|\$executeRawUnsafe|whereRaw|orderByRaw)$
          - focus-metavariable: $S
          # オブジェクトを渡す API (GraphQL など) は、下の text / sql だけを SQL として見る
          - metavariable-regex:
              metavariable: $S
              regex: ^[^{]
      - patterns:
          - pattern-either:
              - pattern: |
                  $DB.query({..., text: $S, ...}, ...)
              - pattern: |
                  $DB.query({..., sql: $S, ...}, ...)
              - pattern: |
                  $DB.execute({..., text: $S, ...}, ...)
              - pattern: |
                  $DB.execute({..., sql: $S, ...}, ...)
          - focus-metavariable: $S
      # Map.get や RegExp.exec と同じ名前なので、引数が SQL の文字列のときだけ見る
      - patterns:
          - pattern: $DB.$M($S, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(run|exec|all|get)$
          - metavariable-regex:
              metavariable: $S
              regex: (?i)^[`"']\s*(SELECT|INSERT|UPDATE|DELETE|WITH|REPLACE|DROP|ALTER|CREATE|PRAGMA)\b
          - focus-metavariable: $S

  - id: nextjs-open-redirect
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値がリダイレクト先になっています (オープンリダイレクト)。同じサイト内のパスであることを検証してください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-601: URL Redirection to Untrusted Site"
      confidence: MEDIUM
    pattern-sources: *sources
    pattern-sanitizers: &same-site
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      # 固定のパス (// で始まらず、連結もしない) をリクエストの URL に解決するだけなら、ホストを変えられない
      - patterns:
          - pattern: new URL($PATH, $BASE)
          - metavariable-regex:
              metavariable: $PATH
              regex: ^("/([^/\\"][^"]*)?"|'/([^/\\'][^']*)?'|`/[^/`$\\][^`]*)$
          - metavariable-regex:
              metavariable: $BASE
              regex: ^(req|request)\.(url|nextUrl(\.origin|\.href)?)$
      # 固定のパスかクエリで始まるテンプレートは、サイトの外へ飛ばせない (// と /${x} と連結は除く)。
      # Semgrep が見るテンプレートの範囲は閉じのバッククォートを含まないため、バッククォートなしで行末まで一致させる
      - patterns:
          - pattern: $T
          - metavariable-regex:
              metavariable: $T
              regex: ^`(/[^/`$\\]|[?#])[^`]*$
    pattern-sinks:
      - patterns:
          - pattern-either: &redirect-calls
              - pattern: redirect($U, ...)
              - pattern: permanentRedirect($U, ...)
              - pattern: $RES.redirect($U, ...)
              - pattern: $RES.redirect($CODE, $U)
              - pattern: router.push($U, ...)
              - pattern: router.replace($U, ...)
              - pattern: location.assign($U)
              - pattern: location.replace($U)
              - pattern: location.href = $U
              - pattern: location = $U
              - pattern: window.location.assign($U)
              - pattern: window.location.replace($U)
              - pattern: window.location.href = $U
              - pattern: window.location = $U
              - pattern: window.open($U, ...)
          - focus-metavariable: $U
          # `${x}?... や `${x}/固定の文字列 で始まるものは、宛先を決める x だけを次の sink で見る。
          # `${x}/${y} は x が / だと //y になりサイトの外へ飛ぶので、全体を見る。オブジェクトは下の sink で宛先のキーだけを見る
          - metavariable-regex:
              metavariable: $U
              regex: ^(?!\{|`\$\{[^}]+\}(/[^/\\`$?#]+([/?#][^`]*)?|[?#][^`]*)$)
      - patterns:
          - pattern-either: *redirect-calls
          - metavariable-regex:
              metavariable: $U
              regex: ^`\$\{[^}]+\}(/[^/\\`$?#]+([/?#][^`]*)?|[?#][^`]*)$
          - metavariable-pattern:
              metavariable: $U
              pattern: |
                `${$HEAD}...`
          - focus-metavariable: $HEAD
      - patterns:
          - pattern: |
              new $R($B, {..., headers: {..., $H: $U, ...}, ...})
          - metavariable-regex:
              metavariable: $R
              regex: ^(Response|NextResponse)$
          - metavariable-regex:
              metavariable: $H
              regex: (?i)^["']?location["']?$
          - focus-metavariable: $U
      - patterns:
          - pattern: $HEADERS.$M($H, $U)
          - metavariable-regex:
              metavariable: $M
              regex: ^(set|append|setHeader)$
          - metavariable-regex:
              metavariable: $H
              regex: (?i)^["'`]location["'`]$
          - focus-metavariable: $U
      - patterns:
          - pattern: |
              ({..., redirect: {..., destination: $U, ...}, ...})
          - focus-metavariable: $U
      - patterns:
          - pattern-either:
              - pattern: |
                  redirect({..., $K: $U, ...}, ...)
              - pattern: |
                  router.push({..., $K: $U, ...}, ...)
              - pattern: |
                  router.replace({..., $K: $U, ...}, ...)
          - metavariable-regex:
              metavariable: $K
              regex: ^(pathname|href)$
          - focus-metavariable: $U

  - id: nextjs-rewrite
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値が rewrite の宛先になっています (SSRF)。同じサイト内の固定のパスにしてください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      confidence: MEDIUM
    pattern-sources: *sources
    pattern-sanitizers: *same-site
    pattern-sinks:
      - patterns:
          - pattern: NextResponse.rewrite($U, ...)
          # リクエストの URL を写し、パスやクエリだけを変えたものは、ホストが変わらない (ホストを変える代入は下の sink で見る)
          - pattern-not-inside: |
              $U = $R.nextUrl.clone();
              ...
          - pattern-not-inside: |
              $U = new URL($R.url);
              ...
          - pattern-not-inside: |
              $U = new URL($R.nextUrl);
              ...
          - focus-metavariable: $U
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $U = $R.nextUrl.clone();
                  ...
              - pattern-inside: |
                  $U = new URL($R.url);
                  ...
              - pattern-inside: |
                  $U = new URL($R.nextUrl);
                  ...
          - pattern-either:
              - pattern: $U.host = $X
              - pattern: $U.hostname = $X
              - pattern: $U.href = $X
              - pattern: $U.protocol = $X
              - pattern: $U.port = $X
          - focus-metavariable: $X

  - id: nextjs-command-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値がシェルのコマンドに入っています (コマンドインジェクション)。execFile で引数を分けて渡してください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      confidence: HIGH
    pattern-sources: *sources
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
    pattern-sinks:
      - patterns:
          - pattern: $F($C, ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(exec|execSync|execAsync|execFile|execFileSync|spawn|spawnSync)$
          - focus-metavariable: $C
      # RegExp.exec と同じ名前の exec は、child_process のものだけを見る
      - patterns:
          - pattern-either:
              - pattern: child_process.exec($C, ...)
              - pattern: cp.exec($C, ...)
              - patterns:
                  - pattern: $NS.$F($C, ...)
                  - metavariable-regex:
                      metavariable: $F
                      regex: ^(execSync|execFile|execFileSync|spawn|spawnSync)$
          - focus-metavariable: $C
      # shell が false 以外だと、コマンドも引数もつないでシェルが解釈する
      - patterns:
          - pattern-either:
              - pattern: |
                  $F($X, $C, {..., shell: $SHELL, ...}, ...)
              - pattern: |
                  $NS.$F($X, $C, {..., shell: $SHELL, ...}, ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(spawn|spawnSync|execFile|execFileSync)$
          - metavariable-regex:
              metavariable: $SHELL
              regex: ^(?!false$)
          - focus-metavariable: $C
      # sh -c (-lc・-ec なども) に渡した文字列は、シェルのコマンドとして解釈される
      - patterns:
          - pattern-either:
              - pattern: |
                  $F($SH, [..., $FLAG, $C, ...], ...)
              - pattern: |
                  $NS.$F($SH, [..., $FLAG, $C, ...], ...)
          - metavariable-regex:
              metavariable: $FLAG
              regex: ^["'`]-[a-zA-Z]*c[a-zA-Z]*["'`]$
          - metavariable-regex:
              metavariable: $F
              regex: ^(spawn|spawnSync|execFile|execFileSync)$
          - metavariable-regex:
              metavariable: $SH
              regex: ^["'`](/bin/|/usr/bin/)?(sh|bash|zsh|dash)["'`]$
          - focus-metavariable: $C

  - id: nextjs-code-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値がコードとして実行されます (コードインジェクション)。eval や new Function を使わないでください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      confidence: HIGH
    pattern-sources: *sources
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($C)
              - pattern: new Function(..., $C)
              - pattern: require($C)
              - pattern: import($C)
              - pattern: new vm.Script($C, ...)
              - pattern: runInNewContext($C, ...)
              - pattern: runInThisContext($C, ...)
              - pattern: runInContext($C, ...)
              - patterns:
                  - pattern: vm.$M($C, ...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(runInNewContext|runInThisContext|runInContext|compileFunction)$
          - focus-metavariable: $C

  - id: nextjs-xss
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値がエスケープされずに HTML になります (XSS)。DOMPurify などでサニタイズしてください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation"
      confidence: HIGH
    pattern-sources: *sources
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: DOMPurify.sanitize(...)
      - pattern: sanitizeHtml(...)
      # < をすべてエスケープした形に置き換えると、タグを作れない (Next.js の JSON-LD の書き方: JSON.stringify(x).replace(/</g, "\\u003c"))
      - patterns:
          - pattern-either:
              - pattern: $S.replace(/</g, $R)
              - pattern: $S.replaceAll("<", $R)
              - pattern: $S.replaceAll(/</g, $R)
          - metavariable-regex:
              metavariable: $R
              regex: (?i)^["'`](\\\\u003c|\\\\x3c|&lt;|&#0*60;|&#x0*3c;)["'`]$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: |
                  <$E dangerouslySetInnerHTML={{__html: $X}} />
              - pattern: |
                  <$E dangerouslySetInnerHTML={{__html: $X}}>...</$E>
              - pattern: document.write($X)
              - pattern: $EL.innerHTML = $X
              - pattern: $EL.outerHTML = $X
              - pattern: $EL.insertAdjacentHTML($POS, $X)
          - focus-metavariable: $X
      - patterns:
          - pattern: |
              new $R($X, {..., headers: {..., $H: $V, ...}, ...})
          - metavariable-regex:
              metavariable: $R
              regex: ^(Response|NextResponse)$
          - metavariable-regex:
              metavariable: $H
              regex: (?i)^["']?content-type["']?$
          - metavariable-regex:
              metavariable: $V
              regex: (?i)^["'`]text/html
          - focus-metavariable: $X

  - id: nextjs-xss-url
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: リクエストの値がリンクや埋め込みの URL になっています (javascript スキームなどの XSS)。同じサイト内のパスであることを検証してください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation"
      confidence: MEDIUM
    pattern-sources: *sources
    pattern-sanitizers: *same-site
    pattern-sinks:
      - patterns:
          - pattern-either: &url-attrs
              - pattern: |
                  <$E href={$X} />
              - pattern: |
                  <$E href={$X}>...</$E>
          # Link の href のオブジェクトは、下の sink で宛先のキーだけを見る。
          # `${x}?... や `${x}/固定の文字列 で始まるものは、宛先を決める x だけを次の sink で見る
          - metavariable-regex:
              metavariable: $X
              regex: ^(?!\{|`\$\{[^}]+\}(/[^/\\`$?#]+([/?#][^`]*)?|[?#][^`]*)$)
          - focus-metavariable: $X
      - patterns:
          - pattern-either: *url-attrs
          - metavariable-regex:
              metavariable: $X
              regex: ^`\$\{[^}]+\}(/[^/\\`$?#]+([/?#][^`]*)?|[?#][^`]*)$
          - metavariable-pattern:
              metavariable: $X
              pattern: |
                `${$HEAD}...`
          - focus-metavariable: $HEAD
      - patterns:
          - pattern-either:
              - pattern: |
                  <$E href={{..., $K: $X, ...}} />
              - pattern: |
                  <$E href={{..., $K: $X, ...}}>...</$E>
          - metavariable-regex:
              metavariable: $K
              regex: ^(pathname|href)$
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: |
                  <$E src={$X} />
              - pattern: |
                  <$E src={$X}>...</$E>
          - metavariable-regex:
              metavariable: $E
              regex: ^(iframe|script|Script)$
          - focus-metavariable: $X

  - id: nextjs-image-any-host
    languages: [typescript, javascript]
    severity: ERROR
    message: next/image のサーバーが、どのホストの画像でも取りに行きます (SSRF)。images.remotePatterns は必要なホストだけにし、dangerouslyAllowLocalIP は使わないでください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      confidence: HIGH
    pattern-either:
      - patterns:
          - pattern-inside: |
              {..., remotePatterns: [...], ...}
          - pattern: |
              {..., hostname: "**", ...}
      - patterns:
          - pattern-inside: |
              {..., remotePatterns: [...], ...}
          - pattern: new URL($U)
          - metavariable-regex:
              metavariable: $U
              regex: ^["'`]https?://\*\*([/:"'`]|$)
      - pattern: |
          {..., dangerouslyAllowLocalIP: true, ...}

  - id: nextjs-public-env-secret
    languages: [typescript, javascript]
    severity: ERROR
    message: NEXT_PUBLIC_ で始まる環境変数は、ビルド時にブラウザ向けの JS に埋め込まれ、誰でも読めます。秘密の値は NEXT_PUBLIC_ を付けない名前にし、サーバーだけで読んでください。
    metadata:
      category: security
      technology: [nextjs]
      cwe: "CWE-540: Inclusion of Sensitive Information in Source Code"
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: process.env.$NAME
          - pattern: process.env["$NAME"]
      # 秘密の値を表す語で終わる名前 (NEXT_PUBLIC_IS_PRIVATE_BETA や NEXT_PUBLIC_OAUTH_TOKEN_URL は除く)。
      # TOKEN・ACCESS_KEY だけでは見ない。Mapbox や Datadog のように、ブラウザで使う前提で公開するトークンがあるため
      - metavariable-regex:
          metavariable: $NAME
          regex: ^NEXT_PUBLIC_(\w+_)?(SECRET|SECRET_KEY|SECRET_ACCESS_KEY|SECRET_TOKEN|AUTH_TOKEN|REFRESH_TOKEN|PRIVATE_KEY|PASSWORD|PASSWD|CREDENTIALS?|SERVICE_ROLE|SERVICE_ROLE_KEY)$
