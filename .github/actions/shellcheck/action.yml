name: "shellcheck でシェルスクリプトを lint"
description: "導入済みの shellcheck で、指定したファイルを severity warning 以上で検査する"

inputs:
  files:
    description: "検査するファイルの JSON 配列"
    required: true

runs:
  using: composite
  steps:
    - name: "shellcheck"
      shell: bash
      env:
        FILES: ${{ inputs.files }}
      run: bash "${GITHUB_ACTION_PATH}/shellcheck.sh"
