name: "Gitleaks でシークレットを検知"
description: "導入済みの gitleaks で PR のコミット範囲をスキャンする"

inputs:
  log-opts:
    description: "スキャンするコミット範囲 (<base>..<head>)"
    required: true

runs:
  using: composite
  steps:
    - name: "Gitleaks スキャン"
      shell: bash
      env:
        LOG_OPTS: ${{ inputs.log-opts }}
      run: bash "${GITHUB_ACTION_PATH}/gitleaks.sh"
