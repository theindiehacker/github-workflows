name: "ty で型チェック"
description: >-
  プロジェクト（uv.lock のあるディレクトリ）の環境で ty を実行する。検査対象と厳しさはプロジェクトの設定に委ね、
  入れ子のプロジェクトは設定の有無によらず除く（uv と依存関係は事前に導入しておく）

inputs:
  version:
    description: "ty（PyPI）の版"
    required: true
  project:
    description: "検査するプロジェクトのディレクトリ"
    required: true
  nested:
    description: "python-targets の出力 nested"
    required: true

runs:
  using: composite
  steps:
    - name: "ty"
      shell: bash
      working-directory: ${{ inputs.project }}
      env:
        TY_VERSION: ${{ inputs.version }}
        PROJECT: ${{ inputs.project }}
        NESTED: ${{ inputs.nested }}
      run: bash "${GITHUB_ACTION_PATH}/ty.sh"
